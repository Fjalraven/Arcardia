<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcardia – Spieler &amp; Berufe</title>
<style>
:root{--paper:#fff0d2;--ink:#492b24;--gold:#e7a85b;--panel:rgba(255,244,220,.95);--green:#287c78;--red:#a83e32;--sky:#e58f5c;--deep:#56334a;--shade:rgba(58,24,30,.25);--crest1:#ffe7a8;--crest2:#e9a458;--crest3:#a94f3b;--crestAccent:#2e8b83}
*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:linear-gradient(var(--shade),var(--shade)),radial-gradient(ellipse at top,var(--sky),var(--deep) 70%);transition:background .5s,color .5s}
body[data-theme="winter"]{--paper:#eaf6ff;--ink:#10243b;--gold:#a9d9f5;--panel:rgba(237,248,255,.95);--green:#287c9f;--red:#8d4358;--sky:#244f78;--deep:#07182e;--shade:rgba(6,24,45,.4);--crest1:#f3fbff;--crest2:#a9d9f5;--crest3:#397ba5;--crestAccent:#4a86a8}body[data-theme="autumn"]{--paper:#f7efe0;--ink:#382616;--gold:#d4a66d;--panel:rgba(255,246,232,.96);--green:#7d6f2a;--red:#b14a30;--sky:#d89b4d;--deep:#6b4d2a;--shade:rgba(58,36,20,.25);--crest1:#ffedc5;--crest2:#d89b4d;--crest3:#985331;--crestAccent:#a45b2e}body[data-theme="spring"]{--paper:#eff8df;--ink:#25351e;--gold:#a6c76b;--panel:rgba(245,255,231,.95);--green:#54833b;--red:#a84949;--sky:#a6ce7b;--deep:#47704a;--shade:rgba(30,58,31,.3);--crest1:#f5ffd9;--crest2:#b6d77c;--crest3:#709b4c;--crestAccent:#739c4e}body[data-theme="summer"]{--paper:#fff8df;--ink:#17443d;--gold:#f6c85f;--panel:rgba(255,250,229,.96);--green:#27836b;--red:#c44f45;--sky:#23a9bd;--deep:#f3a64c;--shade:rgba(10,65,72,.18);--crest1:#fff5b8;--crest2:#ffc24d;--crest3:#ed7651;--crestAccent:#e98548}body[data-theme="midnight"]{--paper:#e9e3ff;--ink:#22183b;--gold:#bba7ff;--panel:rgba(239,234,255,.94);--green:#6742a5;--red:#a33362;--sky:#42366f;--deep:#11152f;--shade:rgba(10,9,35,.3);--crest1:#f5edff;--crest2:#bba7ff;--crest3:#6546a5;--crestAccent:#8964d5}body[data-theme="desert"]{--paper:#fff0d2;--ink:#492b24;--gold:#e7a85b;--panel:rgba(255,244,220,.95);--green:#287c78;--red:#a83e32;--sky:#e58f5c;--deep:#56334a;--shade:rgba(58,24,30,.22);--crest1:#ffe7a8;--crest2:#e9a458;--crest3:#a94f3b;--crestAccent:#2e8b83}body[data-theme="dragon"]{--paper:#ffe6c4;--ink:#371916;--gold:#ff7043;--panel:rgba(255,239,222,.96);--green:#47734b;--red:#a52924;--sky:#6b2825;--deep:#180f1c;--shade:rgba(25,8,12,.28);--crest1:#fff0b0;--crest2:#ff7043;--crest3:#9c1f24;--crestAccent:#be3427}body[data-theme="forest"]{--paper:#e3f0d7;--ink:#1d3024;--gold:#98b878;--panel:rgba(235,246,223,.95);--green:#42774b;--red:#a3463d;--sky:#284d43;--deep:#101e29;--shade:rgba(7,22,18,.3);--crest1:#e4f2c8;--crest2:#86aa65;--crest3:#385b43;--crestAccent:#678a4c}body[data-theme="moor"]{--paper:#e5eee4;--ink:#23352e;--gold:#99b7a3;--panel:rgba(237,245,237,.94);--green:#477a63;--red:#a54b51;--sky:#3e645d;--deep:#192b35;--shade:rgba(13,28,30,.32);--crest1:#e8f4dc;--crest2:#8cac91;--crest3:#43645a;--crestAccent:#76b6a1}
header{position:relative;padding:38px 20px 26px;color:var(--paper);text-align:center;border-bottom:3px solid var(--gold)}.design-picker{position:absolute;top:16px;right:18px;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--gold);border-radius:9px;background:var(--panel);color:var(--ink)}.design-picker select{min-width:130px;padding:7px;border:1px solid var(--gold);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}.crest{display:block;width:110px;height:110px;margin:0 auto 12px;filter:drop-shadow(0 6px 10px #0006)}h1{margin:6px 0;font-size:clamp(2rem,6vw,3.2rem)}header p{margin:0;font-size:1.1rem}main{position:relative;z-index:1;max-width:1050px;margin:22px auto;padding:0 18px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;padding-bottom:8px;border-bottom:2px solid var(--gold)}.tabs button{padding:12px 16px;border:2px solid var(--gold);border-bottom:0;border-radius:9px 9px 0 0;background:#fff8e9b8;color:var(--ink);font:bold 1rem Georgia,serif;cursor:pointer}.tabs button[aria-selected="true"]{background:var(--paper)}.section-title{margin:0 0 16px;color:var(--paper);font-size:1.7rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{border:2px solid var(--gold);border-radius:10px;background:var(--panel);box-shadow:0 5px 15px #0001}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}input,main select{flex:1 1 220px;padding:13px 15px;border:2px solid var(--gold);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}.design-picker select{flex:initial}.player-card{display:flex;align-items:center;gap:10px;padding:14px;color:var(--ink);text-align:left;cursor:pointer;font:inherit;transition:transform .15s}.player-card:hover{transform:translateY(-2px)}.skin-head{width:64px;height:64px;flex:0 0 64px;border:2px solid var(--gold);border-radius:6px;background:#e4d3ae;image-rendering:pixelated}.player-card h3{margin:0 0 8px;font-size:1.2rem;overflow-wrap:anywhere}.player-job{font-weight:bold;color:var(--green)}.player-title{display:block;margin-top:5px;font-weight:bold;color:var(--gold)}.job-card{position:relative;padding:17px 17px 54px}.job-card h3{margin:0 0 8px;font-size:1.2rem}.job-count{margin:0;color:var(--green);font-weight:bold}.job-count.full{color:var(--red)}.job-bar{height:10px;margin-top:12px;overflow:hidden;border-radius:99px;background:#d7c8a9}.job-bar-fill{height:100%;border-radius:inherit;background:var(--green)}.job-bar-fill.full{background:var(--red)}.job-members{display:grid;gap:8px;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--gold);list-style:none}.job-member{display:flex;align-items:center;gap:8px;margin:4px 0}.job-member img{width:40px;height:40px;flex:0 0 40px;border:2px solid var(--gold);border-radius:6px;image-rendering:pixelated}.expand{position:absolute;right:10px;bottom:10px;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer}.empty{grid-column:1/-1;color:var(--paper);text-align:center}.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.region{min-height:100px;padding:18px;border:2px solid var(--gold);border-radius:10px;background:var(--panel);color:var(--green);font-size:1.25rem;font-weight:bold}footer{position:relative;z-index:1;padding:20px;color:var(--paper);text-align:center}#weather{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.particle{position:absolute;left:var(--left);opacity:var(--opacity);animation:fall var(--duration) linear var(--delay) infinite;will-change:transform}body[data-theme="winter"] .particle{top:-12vh;color:#fff;font-size:var(--size)}body[data-theme="autumn"] .particle{top:-12vh;color:var(--leaf);font-size:var(--size)}body[data-theme="spring"] .particle{top:-12vh;color:var(--flower);font-size:var(--size)}body[data-theme="summer"] .particle,body[data-theme="midnight"] .particle,body[data-theme="forest"] .particle{top:var(--top);color:var(--spark);font-size:var(--size);animation:glow var(--duration) ease-in-out var(--delay) infinite alternate}body[data-theme="desert"] .particle{top:var(--top);color:var(--sand);font-size:var(--size);animation:glow var(--duration) ease-in-out var(--delay) infinite alternate}body[data-theme="dragon"] .particle{top:var(--top);color:var(--ember);font-size:var(--size);animation:glow var(--duration) ease-in-out var(--delay) infinite alternate}body[data-theme="moor"] .particle{top:var(--top);color:var(--willow);font-size:var(--size);text-shadow:0 0 12px #a4ffdc;animation:glow var(--duration) ease-in-out var(--delay) infinite alternate}@keyframes fall{to{transform:translate3d(var(--drift),112vh,0) rotate(360deg)}}@keyframes glow{to{transform:translate3d(var(--drift),40px,0) scale(1.2);opacity:1}}dialog{width:min(92vw,560px);max-height:90vh;overflow:auto;border:2px solid var(--gold);border-radius:14px;background:var(--panel);color:var(--ink);box-shadow:0 18px 60px #0008}dialog::backdrop{background:#140e18b8}.profile{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:20px;align-items:center}.profile img{display:block;max-width:100%;max-height:340px;object-fit:contain;image-rendering:pixelated;margin:auto}.close{float:right;padding:8px;border:1px solid var(--gold);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}@media(max-width:520px){.design-picker{top:10px;right:10px}header{padding-top:70px}.design-picker label{display:none}.tabs button{flex:1;padding:11px 8px}.profile{grid-template-columns:1fr}.profile img{max-height:250px}}@media(prefers-reduced-motion:reduce){.particle{display:none}}
</style></head>
<body data-theme="desert"><div id="weather" aria-hidden="true"></div><header><div class="design-picker"><label for="designSelect">Design</label><select id="designSelect"><option value="winter">Winter</option><option value="autumn">Herbst</option><option value="spring">Frühling</option><option value="summer">Sommer</option><option value="midnight">Mitternacht</option><option value="desert">Wüstenabend</option><option value="dragon">Drachenfeuer</option><option value="forest">Nachtwald</option><option value="moor">Nebelmoor</option></select></div><svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Arcardia Wappen"><defs><linearGradient id="shield" x1="0%" x2="0%" y1="0%" y2="100%"><stop stop-color="var(--crest1)"/><stop offset=".5" stop-color="var(--crest2)"/><stop offset="1" stop-color="var(--crest3)"/></linearGradient></defs><path d="M60 8 98 18v38c0 26-16 44-38 54C38 100 22 82 22 56V18z" fill="url(#shield)" stroke="var(--ink)" stroke-width="3"/><path d="M60 18 88 25v30c0 17-12 31-28 39-16-8-28-22-28-39V25z" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><path d="m39 45 21-19 21 19-13-5-8 5-8-5zm7 10 14-11 14 11-3 21-11 9-11-9z" fill="var(--crestAccent)"/><path d="m52 60 8-3 8 3 1 8-9 6-9-6z" fill="var(--crest1)" stroke="var(--ink)"/><circle cx="60" cy="41" r="5" fill="var(--ink)"/><path d="M60 47v37M46 62l14-8 14 8" fill="none" stroke="var(--ink)" stroke-width="3"/></svg><h1>Arcardia</h1><p>Die Bewohner, ihre Berufe und freie Plätze</p></header>
<main><nav class="tabs" role="tablist" aria-label="Arcardia Bereiche"><button role="tab" aria-selected="true" aria-controls="playersPanel">Spieler</button><button role="tab" aria-selected="false" aria-controls="jobsPanel">Berufe</button><button role="tab" aria-selected="false" aria-controls="regionsPanel">Städte &amp; Regionen</button></nav><section id="playersPanel" role="tabpanel"><h2 class="section-title">Spielerinnen und Spieler</h2><div class="controls"><input id="search" type="search" placeholder="Spieler suchen …" aria-label="Spieler suchen"><select id="jobFilter" aria-label="Nach Beruf filtern"><option value="">Alle Berufe</option></select></div><div id="players" class="grid" aria-live="polite"></div></section><section id="jobsPanel" role="tabpanel" hidden><h2 class="section-title">Berufe &amp; freie Plätze</h2><div class="controls"><select id="availability"><option value="all">Alle Berufe</option><option value="free">Nur Berufe mit freien Plätzen</option><option value="occupied">Nur belegte/ausgebuchte Berufe</option></select></div><div id="jobs" class="grid" aria-live="polite"></div></section><section id="regionsPanel" role="tabpanel" hidden><h2 class="section-title">Städte &amp; Regionen</h2><div class="regions"><article class="region">Norden</article><article class="region">Westen</article><article class="region">Osten</article><article class="region">Süden</article></div></section></main>
<dialog id="profileDialog"><button class="close" id="closeProfile" type="button">Schließen ✕</button><div class="profile"><img id="fullSkin" alt=""><div><h2 id="profileName"></h2><p id="profileJobs"></p><p id="profileTitle" class="player-title" hidden></p></div></div></dialog><footer>Willkommen in Arcardia – unserem mittelalterlichen Minecraft-Rollenspiel!</footer>
<script>
const limits={Schmied:5,Marktschreier:5,Magier:5,Bäcker:5,Jäger:5,Bauer:100,Metzger:5,Fischer:100,Ramschladenbesitzer:6,König:1,Königsgarde:3,Wirt:5,Soldat:200,Torwächter:20,Minenarbeiter:100,Mönch:20,Ritter:10,Holzfäller:100,"Rechte Hand des Königs":1};const free={Schmied:0,Marktschreier:0,Magier:0,Bäcker:0,Jäger:0,Metzger:0,Ramschladenbesitzer:0,König:0,Königsgarde:0,Wirt:0,Torwächter:0,Mönch:0,Holzfäller:0,Ritter:0,Minenarbeiter:16,Bauer:23,Soldat:128,Fischer:38,"Rechte Hand des Königs":0};const roles=Object.keys(limits);
const players=[{name:"Fjalraven",jobs:["Magier","Torwächter"]},{name:"DinoNugget1242",jobs:["Minenarbeiter"]},{name:"ItsSamuMC",jobs:["Soldat"]},{name:"C4_Meister",jobs:["Soldat"]},{name:"PaperStraw58602",jobs:["König"]},{name:"Mojel11YT",jobs:["Königsgarde"]},{name:"Benzjamin",jobs:["Wirt"]},{name:"PHOENIX XD",jobs:["Soldat"]},{name:"x_simmi",jobs:["Fischer"]},{name:"PriicyRex4038",jobs:["Torwächter"]},{name:"Mapaa5",jobs:["Fischer"]},{name:"AetherXgames",jobs:["Minenarbeiter"]},{name:"LettLukas",jobs:["Bäcker"]},{name:"Jakobber2000",jobs:["Soldat"]},{name:"xr643",jobs:["Bauer"]},{name:"Caraoelin",jobs:["Bauer"]},{name:"Quirity15",jobs:["Soldat"]},{name:"Delfine4904",jobs:["Bauer"]},{name:"Maax67",jobs:["Mönch"]},{name:"CraftLife12",jobs:["Soldat"]},{name:"zackdiebohn",jobs:["Schmied"]},{name:"Zero",jobs:["Soldat"]},{name:"DiamondDragon",jobs:["Soldat"]},{name:"Sharkalarm",jobs:["Holzfäller"]},{name:"Babbles1042",jobs:["Bauer"]},{name:"RichiHD",jobs:["Bauer"]},{name:"Nao878",jobs:["Soldat"]},{name:"Bluecronik12",jobs:["Bauer"]},{name:"FantasticVici",jobs:["Holzfäller"]},{name:"Zupiruchi",jobs:["Mönch"]},{name:"CaptainBintang",jobs:["Holzfäller"]},{name:"TheFiredoom",jobs:["Minenarbeiter"]},{name:"Akakarivus",jobs:["Ritter"]},{name:"Diefire",jobs:["Ritter"]},{name:"Eigella",jobs:["Minenarbeiter"]},{name:"N04H_MINECR4FT",jobs:["Fischer"]},{name:"Phoenix90312",jobs:["Soldat"]},{name:"Kenanzockt5814",jobs:["Fischer"]},{name:"LeadedSnow51573",jobs:["Ritter"]},{name:"GamedFio2024",jobs:["Fischer"]},{name:"Gedankebar6029",jobs:["Fischer"]},{name:"truewither",jobs:["Soldat"]},{name:"ScarletJP",jobs:["Soldat"]},{name:"Timmm1893",jobs:["Minenarbeiter","Soldat"]},{name:"SnowingSun3017",jobs:["Bauer"]},{name:"Zwergnase2111",jobs:["Soldat"]},{name:"Emilcrafty03",jobs:["Mönch"]},{name:"Spilraleel",jobs:["Bäcker"]},{name:"Entonrat12345",jobs:["Holzfäller","Soldat"]},{name:"MaxiF180",jobs:["Soldat","Bäcker"]},{name:"FindusMC",jobs:["Holzfäller"]},{name:"yellowwider822",jobs:["Soldat"]},{name:"NCHTz1",jobs:["Holzfäller"]},{name:"hannes1235090",jobs:["Bauer","Soldat"]},{name:"Rex_Tenebris377",jobs:["Soldat","Holzfäller"]},{name:"DarkKnightVJ",jobs:["Soldat","Holzfäller"]},{name:"BCCaoti",jobs:["Bauer"]},{name:"Kosmosxp",jobs:["Ritter"]},{name:"babbels1042",jobs:["Bauer"]},{name:"darknightIV",jobs:["Bauer","Soldat"]},{name:"kingofrivers343",jobs:["Rechte Hand des Königs"],title:"Gründer"}];
const pe=document.getElementById('players'),je=document.getElementById('jobs'),search=document.getElementById('search'),jf=document.getElementById('jobFilter'),av=document.getElementById('availability');roles.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;jf.append(o)});
function renderPlayers(){const q=search.value.trim().toLowerCase(),r=jf.value;pe.replaceChildren();const arr=players.filter(p=>p.name.toLowerCase().includes(q)&&(!r||p.jobs.includes(r)));if(!arr.length){pe.innerHTML='<p class="empty">Kein Spieler gefunden.</p>';return}arr.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='card player-card';const im=document.createElement('img');im.className='skin-head';im.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/64`;im.alt='';const info=document.createElement('span'),h=document.createElement('h3'),j=document.createElement('span');h.textContent=p.name;j.className='player-job';j.textContent='Berufe: '+p.jobs.join(', ');info.append(h,j);if(p.title){const t=document.createElement('span');t.className='player-title';t.textContent='Titel: '+p.title;info.append(t)}b.append(im,info);b.onclick=()=>{document.getElementById('profileName').textContent=p.name;document.getElementById('profileJobs').textContent='Berufe: '+p.jobs.join(', ');const t=document.getElementById('profileTitle');t.textContent=p.title?'Titel: '+p.title:'';t.hidden=!p.title;const skin=document.getElementById('fullSkin');skin.src=`https://mc-heads.net/body/${encodeURIComponent(p.name)}/100`;skin.alt='Vollständiger Minecraft-Skin von '+p.name;document.getElementById('profileDialog').showModal()};pe.append(b)})}
function renderJobs(){je.replaceChildren();roles.forEach((r,i)=>{const max=limits[r],members=players.filter(p=>p.jobs.includes(r)),n=Math.min(free[r]??Math.max(0,max-members.length),max);if((av.value==='free'&&n===0)||(av.value==='occupied'&&n>0))return;const c=document.createElement('article');c.className='card job-card';const h=document.createElement('h3'),count=document.createElement('p'),bar=document.createElement('div'),fill=document.createElement('div'),list=document.createElement('ul'),btn=document.createElement('button');h.textContent=r;count.className='job-count'+(n===0?' full':'');count.textContent=n===0?`Ausgebucht (${max-n}/${max})`:`${n} von ${max} Plätzen frei (${max-n} belegt)`;bar.className='job-bar';fill.className='job-bar-fill'+(n===0?' full':'');fill.style.width=Math.min((max-n)/max,1)*100+'%';bar.append(fill);list.className='job-members';list.hidden=true;list.id='members-'+i;members.forEach(p=>{const li=document.createElement('li'),im=document.createElement('img'),name=document.createElement('span');li.className='job-member';im.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/40`;im.alt='';name.textContent=p.name;li.append(im,name);list.append(li)});if(!members.length)list.innerHTML='<li>Kein Spieler eingetragen</li>';btn.className='expand';btn.type='button';btn.textContent='⌄';btn.setAttribute('aria-label','Spieler anzeigen');btn.setAttribute('aria-expanded','false');btn.onclick=()=>{list.hidden=!list.hidden;btn.setAttribute('aria-expanded',String(!list.hidden))};c.append(h,count,bar,list,btn);je.append(c)});if(!je.children.length)je.innerHTML='<p class="empty">Keine Berufe in dieser Auswahl.</p>'}
search.addEventListener('input',renderPlayers);jf.addEventListener('change',renderPlayers);av.addEventListener('change',renderJobs);document.getElementById('closeProfile').onclick=()=>document.getElementById('profileDialog').close();document.getElementById('profileDialog').addEventListener('click',e=>{if(e.target.id==='profileDialog')e.target.close()});document.querySelectorAll('[role=tab]').forEach((tab,i,all)=>{tab.onclick=()=>all.forEach((t,j)=>{t.setAttribute('aria-selected',String(i===j));document.getElementById(t.getAttribute('aria-controls')).hidden=i!==j});tab.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=all[(i+(e.key==='ArrowRight'?1:-1)+all.length)%all.length];next.click();next.focus()}}});
const themes=['winter','autumn','spring','summer','midnight','desert','dragon','forest','moor'],design=document.getElementById('designSelect');function setDesign(t){if(!themes.includes(t))t='desert';document.body.dataset.theme=t;design.value=t;try{localStorage.setItem('arcadia-design',t)}catch{}const glyphs={winter:['❄','✦','❅','✧'],autumn:['🍂','🍁','❧'],spring:['🌷','🌼','✿','❀'],summer:['✦','✧','✹'],midnight:['✦','✧','⋆','✴'],desert:['·','•','✦','⋅'],dragon:['✦','•','✧','⋅'],forest:['✦','✧','⋆','✴'],moor:['✦','·','✧','•']},palettes={summer:['#fff5b0','#ffe17b','#fff'],midnight:['#fff','#e7d8ff','#bba7ff'],desert:['#fff0c2','#e9b66f','#79d7c4'],dragon:['#ffb347','#ff5a1f','#ffd166'],forest:['#fff','#e3f0d7','#b7d77c'],moor:['#c8fff0','#9be7ce','#e5eee4']},weather=document.getElementById('weather');weather.replaceChildren();for(let i=0;i<42;i++){const p=document.createElement('span');p.className='particle';p.textContent=glyphs[t][Math.random()*glyphs[t].length|0];p.style.cssText=`--left:${Math.random()*100}%;--size:${14+Math.random()*12}px;--opacity:${.45+Math.random()*.55};--duration:${5+Math.random()*12}s;--delay:${-Math.random()*12}s;--drift:${-60+Math.random()*120}px;--top:${Math.random()*100}%`;if(palettes[t])p.style.setProperty(t==='desert'?'--sand':t==='dragon'?'--ember':t==='moor'?'--willow':'--spark',palettes[t][i%3]);if(t==='autumn')p.style.setProperty('--leaf',['#c2410c','#e87916','#a16207'][i%3]);if(t==='spring')p.style.setProperty('--flower',['#ff6fae','#ff9f1c','#c084fc'][i%3]);weather.append(p)}}design.addEventListener('change',()=>setDesign(design.value));let saved='desert';try{saved=localStorage.getItem('arcadia-design')||'desert'}catch{}setDesign(saved);renderPlayers();renderJobs();
</script></body></html>
