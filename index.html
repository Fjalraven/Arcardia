designSelect.addEventListener("change",()=>setDesign(designSelect.value));let saved="desert";try{saved=localStorage.getItem("arcadia-design")||"desert"}catch{}setDesign(saved);
function selectTab(selected,focus=false){tabs.forEach(t=>{const on=t===selected;t.button.setAttribute("aria-selected",String(on));t.button.tabIndex=on?0:-1;t.panel.hidden=!on});if(focus)selected.button.focus()}tabs.forEach((t,i)=>{t.button.addEventListener("click",()=>selectTab(t));t.button.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();selectTab(tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length],true)}})});
function renderJobs(){jobsEl.replaceChildren();berufe.forEach((job,i)=>{const max=MAX_PRO_BERUF_NACH_BERUF[job]??DEFAULT_MAX_PRO_BERUF,members=spieler.filter(p=>p.berufe.includes(job)),manualFree=FREIE_PLAETZE_NACH_BERUF[job],free=manualFree===undefined?Math.max(0,max-members.length):Math.min(manualFree,max),filled=max-free,card=document.createElement("article");card.className="job-card";const heading=document.createElement("h3");heading.textContent=job;const count=document.createElement("p");count.className=`job-count${free===0?" full":""}`;count.textContent=free===0?`Ausgebucht (${filled}/${max})`:`${free} von ${max} Plätzen frei (${filled} belegt)`;const bar=document.createElement("div");bar.className="job-bar";bar.setAttribute("role","progressbar");bar.setAttribute("aria-label",`Belegte Plätze für ${job}`);bar.setAttribute("aria-valuemin","0");bar.setAttribute("aria-valuemax",String(max));bar.setAttribute("aria-valuenow",String(filled));const fill=document.createElement("div");fill.className=`job-bar-fill${free===0?" full":""}`;fill.style.width=`${Math.min(filled/max,1)*100}%`;bar.appendChild(fill);const list=document.createElement("ul");list.className="job-members";list.id=`job-members-${i}`;list.hidden=true;if(members.length)members.forEach(p=>{const li=document.createElement("li");li.className="job-member";const img=document.createElement("img");img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/40`;img.alt="";img.width=40;img.height=40;img.onerror=()=>{img.style.visibility="hidden"};const name=document.createElement("span");name.textContent=p.name;li.append(img,name);list.appendChild(li)});else{const li=document.createElement("li");li.textContent="Kein Spieler eingetragen";list.appendChild(li)}const button=makeExpandButton(`Spieler für ${job} anzeigen`,list.id);button.addEventListener("click",()=>{const open=button.getAttribute("aria-expanded")==="true";button.setAttribute("aria-expanded",String(!open));button.setAttribute("aria-label",`Spieler für ${job} ${open?"anzeigen":"ausblenden"}`);list.hidden=open});card.append(heading,count,bar,list,button);jobsEl.appendChild(card)})}
berufe.forEach(j=>{const o=document.createElement("option");o.value=j;o.textContent=j;filterEl.appendChild(o)});
function renderPlayers(){const q=searchEl.value.trim().toLowerCase(),job=filterEl.value,matches=spieler.filter(p=>p.name.toLowerCase().includes(q)&&(!job||p.berufe.includes(job)));playersEl.replaceChildren();if(!matches.length){const e=document.createElement("p");e.className="empty";e.textContent="Kein Spieler gefunden.";playersEl.appendChild(e);return}matches.forEach(p=>{const card=document.createElement("article");card.className="player-card";const img=document.createElement("img");img.className="skin-head";img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/64`;img.alt=`Minecraft-Skin von ${p.name}`;img.width=64;img.height=64;img.onerror=()=>{img.style.visibility="hidden"};const info=document.createElement("div"),name=document.createElement("h3"),job=document.createElement("div");info.className="player-info";name.textContent=p.name;job.className="player-job";job.textContent=p.berufe.length?`Berufe: ${p.berufe.join(", ")}`:"Noch kein Beruf eingetragen";info.append(name,job);card.append(img,info);playersEl.appendChild(card)})}searchEl.addEventListener("input",renderPlayers);filterEl.addEventListener("change",renderPlayers);renderJobs();renderPlayers();
</script></body></html>
