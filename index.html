<style>

header{position:relative;padding:38px 20px 26px;color:var(--paper);text-align:center;border-bottom:3px solid var(--gold)}.design-picker{position:absolute;top:16px;right:18px;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--gold);border-radius:9px;background:var(--panel);color:var(--ink)}.design-picker select{min-width:130px;padding:7px;border:1px solid var(--gold);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}.crest{display:block;width:110px;height:110px;margin:0 auto 12px;filter:drop-shadow(0 6px 10px #0006)}h1{margin:6px 0;font-size:clamp(2rem,6vw,3.2rem)}header p{margin:0;font-size:1.1rem}main{position:relative;z-index:1;max-width:1050px;margin:22px auto;padding:0 18px}.tab-list{display:flex;gap:8px;margin-bottom:20px;padding-bottom:8px;border-bottom:2px solid var(--gold)}.tab-button{padding:12px 20px;border:2px solid var(--gold);border-bottom:0;border-radius:9px 9px 0 0;background:#fff8e9b8;color:var(--ink);font:bold 1rem Georgia,serif;cursor:pointer}.tab-button[aria-selected="true"]{background:var(--paper)}.section-title{margin:0 0 16px;color:var(--paper);font-size:1.7rem}.jobs-grid,.players-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.job-card,.player-card{border:2px solid var(--gold);border-radius:10px;background:var(--panel);box-shadow:0 5px 15px #0001}.job-card{position:relative;padding:17px 17px 54px}.job-card h3,.player-info h3{margin:0 0 8px;font-size:1.2rem}.job-count{margin:0;color:var(--green);font-weight:bold}.job-count.full{color:var(--red)}.job-bar{height:10px;margin-top:12px;overflow:hidden;border-radius:99px;background:#d7c8a9}.job-bar-fill{height:100%;border-radius:inherit;background:var(--green)}.job-bar-fill.full{background:var(--red)}.job-members{display:grid;gap:8px;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--gold);list-style:none}.job-members[hidden]{display:none}.job-member,.player-card{display:flex;align-items:center;gap:10px}.job-member img,.skin-head{width:40px;height:40px;flex:0 0 40px;border:2px solid var(--gold);border-radius:6px;background:#e4d3ae;image-rendering:pixelated}.job-member span{overflow-wrap:anywhere}.expand-button{position:absolute;right:10px;bottom:10px;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer;transition:transform .2s}.expand-button[aria-expanded="true"]{transform:rotate(180deg)}.expand-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}input,main select{flex:1 1 220px;padding:13px 15px;border:2px solid var(--gold);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}.design-picker select{flex:initial}.player-card{padding:14px}.skin-head{width:64px;height:64px;flex-basis:64px}.player-info h3{overflow-wrap:anywhere}.player-job{font-weight:bold;color:var(--green)}.empty{grid-column:1/-1;color:var(--paper);text-align:center}footer{position:relative;z-index:1;padding:20px;color:var(--paper);text-align:center}
#weather{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.particle{position:absolute;left:var(--left);opacity:var(--opacity);animation:fall var(--duration) linear var(--delay) infinite;will-change:transform}body[data-theme="winter"] .particle{top:-12vh;color:#fff;font-size:var(--size)}body[data-theme="autumn"] .particle{top:-12vh;color:var(--leaf);font-size:var(--size)}body[data-theme="spring"] .particle{top:-12vh;color:var(--flower);font-size:var(--size)}body[data-theme="summer"] .particle,body[data-theme="midnight"] .particle,body[data-theme="forest"] .particle{top:var(--top);color:var(--spark);font-size:var(--size);animation:glow var(--duration) ease-in-out var(--delay) infinite alternate}body[data-theme="desert"] .particle{top:var(--top);color:var(--sand);font-size:var(--size);animation:glow var(--duration) ease-in-out var(--delay) infinite alternate}body[data-theme="dragon"] .particle{top:var(--top);color:var(--ember);font-size:var(--size);animation:glow var(--duration) ease-in-out var(--delay) infinite alternate}body[data-theme="moor"] .particle{top:var(--top);color:var(--willow);font-size:var(--size);text-shadow:0 0 12px #a4ffdc;animation:willow-glow var(--duration) ease-in-out var(--delay) infinite alternate}@keyframes fall{to{transform:translate3d(var(--drift),112vh,0) rotate(360deg)}}@keyframes glow{to{transform:translate3d(var(--drift),40px,0) scale(1.2);opacity:1}}@keyframes willow-glow{0%{transform:translate3d(0,0,0) scale(.65);opacity:.2}100%{transform:translate3d(var(--drift),-35px,0) scale(1.3);opacity:.95}}@media(max-width:520px){.design-picker{top:10px;right:10px}header{padding-top:70px}.design-picker label{display:none}}@media(max-width:480px){.tab-button{flex:1;padding:11px 8px}}@media(prefers-reduced-motion:reduce){.particle{display:none}}
</style></head>
<body data-theme="desert"><div id="weather" aria-hidden="true"></div><header><div class="design-picker"><label for="designSelect">Design</label><select id="designSelect" aria-label="Design auswählen"><option value="winter">Winter</option><option value="autumn">Herbst</option><option value="spring">Frühling</option><option value="summer">Sommer</option><option value="midnight">Mitternacht</option><option value="desert">Wüstenabend</option><option value="dragon">Drachenfeuer</option><option value="forest">Nachtwald</option><option value="moor">Nebelmoor</option></select></div>
<svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Arcadia Logo"><defs><linearGradient id="shield" x1="0%" x2="0%" y1="0%" y2="100%"><stop stop-color="var(--crest1)"/><stop offset=".5" stop-color="var(--crest2)"/><stop offset="1" stop-color="var(--crest3)"/></linearGradient></defs><path d="M60 8 98 18v38c0 26-16 44-38 54C38 100 22 82 22 56V18z" fill="url(#shield)" stroke="var(--ink)" stroke-width="3"/><path d="M60 18 88 25v30c0 17-12 31-28 39-16-8-28-22-28-39V25z" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><path d="m39 45 21-19 21 19-13-5-8 5-8-5zm7 10 14-11 14 11-3 21-11 9-11-9z" fill="var(--crestAccent)"/><path d="m52 60 8-3 8 3 1 8-9 6-9-6z" fill="var(--crest1)" stroke="var(--ink)"/><circle cx="60" cy="41" r="5" fill="var(--ink)"/><path d="M60 47v37M46 62l14-8 14 8" fill="none" stroke="var(--ink)" stroke-width="3"/></svg><h1>Arcadia</h1><p>Die Bewohner, ihre Berufe und freie Plätze</p></header>
<main><div class="tab-list" role="tablist" aria-label="Arcadia Bereiche"><button class="tab-button" id="playersTab" type="button" role="tab" aria-selected="true" aria-controls="playersPanel">Spieler</button><button class="tab-button" id="jobsTab" type="button" role="tab" aria-selected="false" aria-controls="jobsPanel">Berufe &amp; freie Plätze</button></div><section id="playersPanel" role="tabpanel" aria-labelledby="playersTab"><h2 class="section-title">Spielerinnen und Spieler</h2><div class="controls"><input id="search" type="search" placeholder="Spieler suchen …" aria-label="Spieler suchen"><select id="jobFilter" aria-label="Nach Beruf filtern"><option value="">Alle Berufe</option></select></div><div id="players" class="players-grid" aria-live="polite"></div></section><section id="jobsPanel" role="tabpanel" aria-labelledby="jobsTab" hidden><h2 class="section-title">Freie Plätze nach Beruf</h2><div id="jobs" class="jobs-grid" aria-live="polite"></div></section></main><footer>Willkommen in Arcadia – unserem mittelalterlichen Minecraft-Rollenspiel!</footer>
<script>
const DEFAULT_MAX_PRO_BERUF=100,MAX_PRO_BERUF_NACH_BERUF={Schmied:5,Marktschreier:5,Magier:5,Bäcker:5,Jäger:5,Bauer:100,Metzger:5,Fischer:100,Ramschladenbesitzer:6,König:1,Königsgarde:3,Wirt:5,Soldat:200,Torwächter:20,Minenarbeiter:100,Mönch:20,Ritter:10,Holzfäller:20},FREIE_PLAETZE_NACH_BERUF={Schmied:0,Marktschreier:0,Magier:0,Bäcker:0,Jäger:0,Metzger:0,Ramschladenbesitzer:0,König:0,Königsgarde:0,Wirt:0,Torwächter:0,Mönch:0,Holzfäller:0,Ritter:0,Minenarbeiter:16,Bauer:23,Soldat:128,Fischer:38};
const berufe=["Schmied","Marktschreier","Magier","Bäcker","Jäger","Bauer","Metzger","Fischer","Ramschladenbesitzer","König","Königsgarde","Wirt","Soldat","Torwächter","Minenarbeiter","Mönch","Holzfäller","Ritter"];
const spieler=[{name:"Fjalraven",berufe:["Magier","Torwächter"]},{name:"DinoNugget1242",berufe:["Minenarbeiter"]},{name:"ItsSamuMC",berufe:["Soldat"]},{name:"C4_Meister",berufe:["Soldat"]},{name:"PaperStraw58602",berufe:["König"]},{name:"Mojel11YT",berufe:["Königsgarde"]},{name:"Benzjamin",berufe:["Wirt"]},{name:"PHOENIX XD",berufe:["Soldat"]},{name:"x_simmi",berufe:["Fischer"]},{name:"PriicyRex4038",berufe:["Torwächter"]},{name:"Mapaa5",berufe:["Fischer"]},{name:"AetherXgames",berufe:["Minenarbeiter"]},{name:"LettLukas",berufe:["Bäcker"]},{name:"Jakobber2000",berufe:["Soldat"]},{name:"xr643",berufe:["Bauer"]},{name:"Caraoelin",berufe:["Bauer"]},{name:"Quirity15",berufe:["Soldat"]},{name:"Delfine4904",berufe:["Bauer"]},{name:"Maax67",berufe:["Mönch"]},{name:"CraftLife12",berufe:["Soldat"]},{name:"zackdiebohn",berufe:["Schmied"]},{name:"Zero",berufe:["Soldat"]},{name:"DiamondDragon",berufe:["Soldat"]},{name:"Sharkalarm",berufe:["Holzfäller"]},{name:"Babbles1042",berufe:["Bauer"]},{name:"RichiHD",berufe:["Bauer"]},{name:"Nao878",berufe:["Soldat"]},{name:"Bluecronik12",berufe:["Bauer"]},{name:"FantasticVici",berufe:["Holzfäller"]},{name:"Zupiruchi",berufe:["Mönch"]},{name:"CaptainBintang",berufe:["Holzfäller"]},{name:"TheFiredoom",berufe:["Minenarbeiter"]},{name:"Akakarivus",berufe:["Ritter"]},{name:"Diefire",berufe:["Ritter"]},{name:"Eigella",berufe:["Minenarbeiter"]},{name:"N04H_MINECR4FT",berufe:["Fischer"]},{name:"Phoenix90312",berufe:["Soldat"]},{name:"Kenanzockt5814",berufe:["Fischer"]},{name:"LeadedSnow51573",berufe:["Ritter"]},{name:"GamedFio2024",berufe:["Fischer"]},{name:"Gedankebar6029",berufe:["Fischer"]},{name:"truewither",berufe:["Soldat"]},{name:"ScarletJP",berufe:["Soldat"]},{name:"Timmm1893",berufe:["Minenarbeiter","Soldat"]},{name:"SnowingSun3017",berufe:["Bauer"]},{name:"Zwergnase2111",berufe:["Soldat"]},{name:"Emilcrafty03",berufe:["Mönch"]},{name:"Spilraleel",berufe:["Bäcker"]},{name:"Entonrat12345",berufe:["Ritter"]},{name:"MaxiF180",berufe:["Soldat","Bäcker"]},{name:"FindusMC",berufe:["Holzfäller"]},{name:"yellowwider822",berufe:["Soldat"]},{name:"NCHTz1",berufe:["Holzfäller"]},{name:"hannes1235090",berufe:["Bauer","Soldat"]},{name:"Rex_Tenebris377",berufe:["Soldat","Holzfäller"]},{name:"DarkKnightVJ",berufe:["Soldat","Holzfäller"]}];
const jobsEl=document.getElementById("jobs"),playersEl=document.getElementById("players"),searchEl=document.getElementById("search"),filterEl=document.getElementById("jobFilter"),designSelect=document.getElementById("designSelect"),weatherEl=document.getElementById("weather"),themes=["winter","autumn","spring","summer","midnight","desert","dragon","forest","moor"];
function setDesign(theme){const selected=themes.includes(theme)?theme:"desert";document.body.dataset.theme=selected;designSelect.value=selected;try{localStorage.setItem("arcadia-design",selected)}catch{}weatherEl.replaceChildren();const glyphs={winter:["❄","✦","❅","✧"],autumn:["🍂","🍁","❧"],spring:["🌷","🌼","✿","❀"],summer:["✦","✧","✹"],midnight:["✦","✧","⋆","✴"],desert:["·","•","✦","⋅"],dragon:["✦","•","✧","⋅"],forest:["✦","✧","⋆","✴"],moor:["✦","·","✧","•"]},palettes={summer:["#fff5b0","#ffe17b","#fff"],midnight:["#fff","#e7d8ff","#bba7ff"],desert:["#fff0c2","#e9b66f","#79d7c4"],dragon:["#ffb347","#ff5a1f","#ffd166"],forest:["#fff","#e3f0d7","#b7d77c"],moor:["#c8fff0","#9be7ce","#e5eee4"]};for(let i=0;i<42;i++){const p=document.createElement("span");p.className="particle";p.textContent=glyphs[selected][Math.random()*glyphs[selected].length|0];p.style.cssText=`--left:${Math.random()*100}%;--size:${14+Math.random()*12}px;--opacity:${.45+Math.random()*.55};--duration:${5+Math.random()*12}s;--delay:${-Math.random()*12}s;--drift:${-60+Math.random()*120}px;--top:${Math.random()*100}%`;if(palettes[selected])p.style.setProperty(selected==="desert"?"--sand":selected==="dragon"?"--ember":selected==="moor"?"--willow":"--spark",palettes[selected][i%3]);if(selected==="autumn")p.style.setProperty("--leaf",["#c2410c","#e87916","#a16207"][i%3]);if(selected==="spring")p.style.setProperty("--flower",["#ff6fae","#ff9f1c","#c084fc"][i%3]);weatherEl.append(p)}}
designSelect.addEventListener("change",()=>setDesign(designSelect.value));let saved="desert";try{saved=localStorage.getItem("arcadia-design")||"desert"}catch{}setDesign(saved);
document.querySelectorAll('[role="tab"]').forEach((tab,i,all)=>{tab.addEventListener("click",()=>{all.forEach((t,j)=>{const active=j===i;t.setAttribute("aria-selected",String(active));document.getElementById(t.getAttribute("aria-controls")).hidden=!active})});tab.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const next=all[(i+(e.key==="ArrowRight"?1:-1)+all.length)%all.length];next.click();next.focus()}})});
function renderJobs(){jobsEl.replaceChildren();berufe.forEach((job,i)=>{const max=MAX_PRO_BERUF_NACH_BERUF[job]??DEFAULT_MAX_PRO_BERUF,members=spieler.filter(p=>p.berufe.includes(job)),free=Math.min(FREIE_PLAETZE_NACH_BERUF[job]??Math.max(0,max-members.length),max),filled=max-free,card=document.createElement("article");card.className="job-card";const h=document.createElement("h3");h.textContent=job;const count=document.createElement("p");count.className=`job-count${free===0?" full":""}`;count.textContent=free===0?`Ausgebucht (${filled}/${max})`:`${free} von ${max} Plätzen frei (${filled} belegt)`;const bar=document.createElement("div");bar.className="job-bar";bar.setAttribute("role","progressbar");bar.setAttribute("aria-valuemin","0");bar.setAttribute("aria-valuemax",max);bar.setAttribute("aria-valuenow",filled);bar.setAttribute("aria-label",`Belegte Plätze für ${job}`);const fill=document.createElement("div");fill.className=`job-bar-fill${free===0?" full":""}`;fill.style.width=`${Math.min(filled/max,1)*100}%`;bar.append(fill);const list=document.createElement("ul");list.className="job-members";list.id=`members-${i}`;list.hidden=true;if(members.length)members.forEach(p=>{const li=document.createElement("li");li.className="job-member";const img=document.createElement("img");img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/40`;img.alt="";const name=document.createElement("span");name.textContent=p.name;li.append(img,name);list.append(li)});else{const li=document.createElement("li");li.textContent="Kein Spieler eingetragen";list.append(li)}const button=document.createElement("button");button.className="expand-button";button.type="button";button.setAttribute("aria-label",`Spieler für ${job} anzeigen`);button.setAttribute("aria-expanded","false");button.setAttribute("aria-controls",list.id);button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';button.onclick=()=>{list.hidden=!list.hidden;button.setAttribute("aria-expanded",String(!list.hidden))};card.append(h,count,bar,list,button);jobsEl.append(card)})}
berufe.forEach(j=>{const o=document.createElement("option");o.value=j;o.textContent=j;filterEl.append(o)});function renderPlayers(){const q=searchEl.value.trim().toLowerCase(),job=filterEl.value,matches=spieler.filter(p=>p.name.toLowerCase().includes(q)&&(!job||p.berufe.includes(job)));playersEl.replaceChildren();if(!matches.length){const e=document.createElement("p");e.className="empty";e.textContent="Kein Spieler gefunden.";playersEl.append(e);return}matches.forEach(p=>{const card=document.createElement("article");card.className="player-card";const img=document.createElement("img");img.className="skin-head";img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/64`;img.alt=`Minecraft-Skin von ${p.name}`;const info=document.createElement("div"),name=document.createElement("h3"),jobEl=document.createElement("div");info.className="player-info";name.textContent=p.name;jobEl.className="player-job";jobEl.textContent=`Berufe: ${p.berufe.join(", ")}`;info.append(name,jobEl);card.append(img,info);playersEl.append(card)})}searchEl.addEventListener("input",renderPlayers);filterEl.addEventListener("change",renderPlayers);renderJobs();renderPlayers();
