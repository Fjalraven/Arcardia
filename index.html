<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arcardia – Spieler &amp; Berufe</title>
<style>
:root{--paper:#fff0d2;--ink:#492b24;--gold:#e7a85b;--panel:rgba(255,244,220,.95);--green:#287c78;--red:#a83e32;--sky:#e58f5c;--deep:#56334a;--crest1:#ffe7a8;--crest2:#e9a458;--crest3:#a94f3b;--crestAccent:#2e8b83}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:linear-gradient(#0003,#0003),radial-gradient(ellipse at top,var(--sky),var(--deep) 70%)}body[data-theme=winter]{--paper:#eaf6ff;--ink:#10243b;--gold:#a9d9f5;--panel:#edf8fff2;--green:#287c9f;--red:#8d4358;--sky:#244f78;--deep:#07182e;--crest1:#f3fbff;--crest2:#a9d9f5;--crest3:#397ba5;--crestAccent:#4a86a8}body[data-theme=autumn]{--paper:#f7efe0;--ink:#382616;--gold:#d4a66d;--panel:#fff6e8f5;--green:#7d6f2a;--red:#b14a30;--sky:#d89b4d;--deep:#6b4d2a}body[data-theme=spring]{--paper:#eff8df;--ink:#25351e;--gold:#a6c76b;--panel:#f5ffe7f2;--green:#54833b;--red:#a84949;--sky:#a6ce7b;--deep:#47704a}body[data-theme=summer]{--paper:#fff8df;--ink:#17443d;--gold:#f6c85f;--panel:#fffbe9f5;--green:#27836b;--red:#c44f45;--sky:#23a9bd;--deep:#f3a64c}body[data-theme=midnight]{--paper:#e9e3ff;--ink:#22183b;--gold:#bba7ff;--panel:#efebfff2;--green:#6742a5;--red:#a33362;--sky:#42366f;--deep:#11152f}body[data-theme=dragon]{--paper:#ffe6c4;--ink:#371916;--gold:#ff7043;--panel:#ffefdef5;--green:#47734b;--red:#a52924;--sky:#6b2825;--deep:#180f1c}body[data-theme=forest]{--paper:#e3f0d7;--ink:#1d3024;--gold:#98b878;--panel:#ebf6e3f2;--green:#42774b;--red:#a3463d;--sky:#284d43;--deep:#101e29}body[data-theme=moor]{--paper:#e5eee4;--ink:#23352e;--gold:#99b7a3;--panel:#edf5edf2;--green:#477a63;--red:#a54b51;--sky:#3e645d;--deep:#192b35}
header,footer{position:relative;z-index:1;text-align:center;color:var(--paper)}header{padding:30px 16px 22px;border-bottom:3px solid var(--gold)}h1{margin:4px;font-size:clamp(2rem,6vw,3rem)}header p{margin:4px}.design-picker{position:absolute;right:16px;top:14px;padding:8px;background:var(--panel);border:1px solid var(--gold);border-radius:8px;color:var(--ink)}.crest{width:80px;height:80px;display:block;margin:10px auto}main{position:relative;z-index:1;max-width:1100px;margin:22px auto;padding:0 18px}.tabs,.controls{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}.tabs{border-bottom:2px solid var(--gold);padding-bottom:8px}.tabs button{padding:11px 15px;border:2px solid var(--gold);border-bottom:0;border-radius:8px 8px 0 0;background:#fff8e9b8;color:var(--ink);font:bold 1rem Georgia,serif;cursor:pointer}.tabs button[aria-selected=true]{background:var(--paper)}input,main select{flex:1 1 200px;padding:12px;border:2px solid var(--gold);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}.design-picker select{min-width:120px}.grid,.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{border:2px solid var(--gold);border-radius:10px;background:var(--panel);box-shadow:0 5px 15px #0002}.player-card{display:flex;align-items:center;gap:11px;padding:12px;color:var(--ink);text-align:left;cursor:pointer;font:inherit}.player-card:hover{transform:translateY(-2px)}.skin-head{width:58px;height:58px;border:2px solid var(--gold);border-radius:6px;image-rendering:pixelated}.player-card h3{margin:0 0 5px;overflow-wrap:anywhere}.player-job{color:var(--green);font-weight:bold}.player-title{display:block;color:#9b6b22;font-weight:bold;margin-top:4px}.job-card{position:relative;padding:15px 15px 52px}.job-card h3{margin:0 0 7px}.job-count{margin:0;color:var(--green);font-weight:bold}.job-count.full{color:var(--red)}.bar{height:9px;margin-top:10px;background:#d7c8a9;border-radius:20px;overflow:hidden}.bar-fill{height:100%;background:var(--green)}.bar-fill.full{background:var(--red)}.members{padding:8px 0 0;margin:10px 0 0;border-top:1px solid var(--gold);list-style:none}.members li{display:flex;align-items:center;gap:8px;margin:5px 0}.members img{width:32px;height:32px;image-rendering:pixelated;border:1px solid var(--gold);border-radius:4px}.expand{position:absolute;right:10px;bottom:9px;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:var(--paper);cursor:pointer}.section-title{color:var(--paper)}.region{min-height:100px;padding:18px;border:2px solid var(--gold);border-radius:10px;background:var(--panel);font-weight:bold;color:var(--green)}.empty{grid-column:1/-1;color:var(--paper);text-align:center}dialog{width:min(92vw,540px);border:2px solid var(--gold);border-radius:14px;background:var(--panel);color:var(--ink)}dialog::backdrop{background:#100d1cbb}.profile{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:center}.profile img{width:100%;max-height:330px;object-fit:contain;image-rendering:pixelated}.close{float:right;padding:8px;border:1px solid var(--gold);background:var(--paper);border-radius:6px;cursor:pointer}#weather{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.particle{position:absolute;left:var(--x);top:-10vh;color:white;font-size:var(--size);animation:fall var(--time) linear var(--delay) infinite}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(360deg)}}@media(max-width:600px){header{padding-top:65px}.design-picker{right:8px;top:8px}.design-picker label{display:none}.profile{grid-template-columns:1fr}.profile img{max-height:230px}}@media(prefers-reduced-motion:reduce){.particle{display:none}}
</style></head>
<body data-theme="desert"><div id="weather" aria-hidden="true"></div><header><div class="design-picker"><label for="design">Design </label><select id="design"><option value="winter">Winter</option><option value="autumn">Herbst</option><option value="spring">Frühling</option><option value="summer">Sommer</option><option value="midnight">Mitternacht</option><option value="desert">Wüstenabend</option><option value="dragon">Drachenfeuer</option><option value="forest">Nachtwald</option><option value="moor">Nebelmoor</option></select></div><svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Arcardia Wappen"><defs><linearGradient id="shield" x2="0" y2="1"><stop stop-color="var(--crest1)"/><stop offset=".5" stop-color="var(--crest2)"/><stop offset="1" stop-color="var(--crest3)"/></linearGradient></defs><path d="M60 8 98 18v38c0 26-16 44-38 54C38 100 22 82 22 56V18z" fill="url(#shield)" stroke="var(--ink)" stroke-width="3"/><path d="m39 45 21-19 21 19-13-5-8 5-8-5zm7 10 14-11 14 11-3 21-11 9-11-9z" fill="var(--crestAccent)"/><circle cx="60" cy="41" r="5" fill="var(--ink)"/></svg><h1>Arcardia</h1><p>Die Bewohner, ihre Berufe und freie Plätze</p></header>
<main><nav class="tabs" role="tablist" aria-label="Arcardia Bereiche"><button role="tab" aria-selected="true" aria-controls="playersPanel">Spieler</button><button role="tab" aria-selected="false" aria-controls="jobsPanel">Berufe</button><button role="tab" aria-selected="false" aria-controls="regionsPanel">Städte &amp; Regionen</button></nav><section id="playersPanel" role="tabpanel"><h2 class="section-title">Spielerinnen und Spieler</h2><div class="controls"><input id="search" type="search" placeholder="Spieler suchen …" aria-label="Spieler suchen"><select id="jobFilter" aria-label="Nach Beruf filtern"><option value="">Alle Berufe</option></select></div><div id="players" class="grid" aria-live="polite"></div></section><section id="jobsPanel" role="tabpanel" hidden><h2 class="section-title">Berufe &amp; freie Plätze</h2><div class="controls"><select id="availability" aria-label="Berufe nach Belegung filtern"><option value="all">Alle Berufe</option><option value="free">Nur Berufe mit freien Plätzen</option><option value="occupied">Nur belegte/ausgebuchte Berufe</option></select></div><div id="jobs" class="grid" aria-live="polite"></div></section><section id="regionsPanel" role="tabpanel" hidden><h2 class="section-title">Städte &amp; Regionen</h2><div class="regions"><article class="region">Norden</article><article class="region">Westen</article><article class="region">Osten</article><article class="region">Süden</article></div></section></main>
<dialog id="profileDialog"><button class="close" id="closeProfile" type="button">Schließen ✕</button><div class="profile"><img id="fullSkin" alt=""><div><h2 id="profileName"></h2><p id="profileJobs"></p><p id="profileTitle" class="player-title" hidden></p></div></div></dialog><footer>Willkommen in Arcardia – unserem mittelalterlichen Minecraft-Rollenspiel!</footer>
<script>
const limits={Schmied:5,Marktschreier:5,Magier:5,Bäcker:5,Jäger:5,Bauer:100,Metzger:5,Fischer:100,Ramschladenbesitzer:6,König:1,Königsgarde:3,Wirt:5,Soldat:200,Torwächter:20,Minenarbeiter:100,Mönch:20,Ritter:10,Holzfäller:100,"Rechte Hand des Königs":1};const free={Schmied:0,Marktschreier:0,Magier:0,Bäcker:0,Jäger:0,Metzger:0,Ramschladenbesitzer:0,König:0,Königsgarde:0,Wirt:0,Torwächter:0,Mönch:0,Holzfäller:0,Ritter:0,Minenarbeiter:16,Bauer:23,Soldat:128,Fischer:38,"Rechte Hand des Königs":0};const roles=Object.keys(limits);
const players=[{name:"Fjalraven",jobs:["Magier","Torwächter"]},{name:"DinoNugget1242",jobs:["Minenarbeiter"]},{name:"ItsSamuMC",jobs:["Soldat"]},{name:"C4_Meister",jobs:["Soldat"]},{name:"PaperStraw58602",jobs:["König"]},{name:"Mojel11YT",jobs:["Königsgarde"]},{name:"Benzjamin",jobs:["Wirt"]},{name:"PHOENIX XD",jobs:["Soldat"]},{name:"x_simmi",jobs:["Fischer"]},{name:"PriicyRex4038",jobs:["Torwächter"]},{name:"Mapaa5",jobs:["Fischer"]},{name:"AetherXgames",jobs:["Minenarbeiter"]},{name:"LettLukas",jobs:["Bäcker"]},{name:"Jakobber2000",jobs:["Soldat"]},{name:"xr643",jobs:["Bauer"]},{name:"Caraoelin",jobs:["Bauer"]},{name:"Quirity15",jobs:["Soldat"]},{name:"Delfine4904",jobs:["Bauer"]},{name:"Maax67",jobs:["Mönch"]},{name:"CraftLife12",jobs:["Soldat"]},{name:"zackdiebohn",jobs:["Schmied"]},{name:"Zero",jobs:["Soldat"]},{name:"DiamondDragon",jobs:["Soldat"]},{name:"Sharkalarm",jobs:["Holzfäller"]},{name:"Babbles1042",jobs:["Bauer"]},{name:"RichiHD",jobs:["Bauer"]},{name:"Nao878",jobs:["Soldat"]},{name:"Bluecronik12",jobs:["Bauer"]},{name:"FantasticVici",jobs:["Holzfäller"]},{name:"Zupiruchi",jobs:["Mönch"]},{name:"CaptainBintang",jobs:["Holzfäller"]},{name:"TheFiredoom",jobs:["Minenarbeiter"]},{name:"Akakarivus",jobs:["Ritter"]},{name:"Diefire",jobs:["Ritter"]},{name:"Eigella",jobs:["Minenarbeiter"]},{name:"N04H_MINECR4FT",jobs:["Fischer"]},{name:"Phoenix90312",jobs:["Soldat"]},{name:"Kenanzockt5814",jobs:["Fischer"]},{name:"LeadedSnow51573",jobs:["Ritter"]},{name:"GamedFio2024",jobs:["Fischer"]},{name:"Gedankebar6029",jobs:["Fischer"]},{name:"truewither",jobs:["Soldat"]},{name:"ScarletJP",jobs:["Soldat"]},{name:"Timmm1893",jobs:["Minenarbeiter","Soldat"]},{name:"SnowingSun3017",jobs:["Bauer"]},{name:"Zwergnase2111",jobs:["Soldat"]},{name:"Emilcrafty03",jobs:["Mönch"]},{name:"Spilraleel",jobs:["Bäcker"]},{name:"Entonrat12345",jobs:["Holzfäller","Soldat"]},{name:"MaxiF180",jobs:["Soldat","Bäcker"]},{name:"FindusMC",jobs:["Holzfäller"]},{name:"yellowwider822",jobs:["Soldat"]},{name:"NCHTz1",jobs:["Holzfäller"]},{name:"hannes1235090",jobs:["Bauer","Soldat"]},{name:"Rex_Tenebris377",jobs:["Soldat","Holzfäller"]},{name:"DarkKnightVJ",jobs:["Soldat","Holzfäller"]},{name:"BCCaoti",jobs:["Bauer"]},{name:"Kosmosxp",jobs:["Ritter"]},{name:"babbels1042",jobs:["Bauer"]},{name:"darknightIV",jobs:["Bauer","Soldat"]},{name:"kingofrivers343",jobs:["Rechte Hand des Königs"],title:"Gründer"}];
const pe=document.getElementById('players'),je=document.getElementById('jobs'),search=document.getElementById('search'),jf=document.getElementById('jobFilter'),av=document.getElementById('availability');roles.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;jf.append(o)});
function renderPlayers(){const q=search.value.trim().toLowerCase(),r=jf.value;pe.replaceChildren();const arr=players.filter(p=>p.name.toLowerCase().includes(q)&&(!r||p.jobs.includes(r)));if(!arr.length){pe.innerHTML='<p class="empty">Kein Spieler gefunden.</p>';return}arr.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='card player-card';const im=document.createElement('img');im.className='skin-head';im.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/64`;im.alt='';const info=document.createElement('span'),h=document.createElement('h3'),j=document.createElement('span');h.textContent=p.name;j.className='player-job';j.textContent='Berufe: '+p.jobs.join(', ');info.append(h,j);if(p.title){const t=document.createElement('span');t.className='player-title';t.textContent='Titel: '+p.title;info.append(t)}b.append(im,info);b.onclick=()=>{document.getElementById('profileName').textContent=p.name;document.getElementById('profileJobs').textContent='Berufe: '+p.jobs.join(', ');const t=document.getElementById('profileTitle');t.textContent=p.title?'Titel: '+p.title:'';t.hidden=!p.title;const skin=document.getElementById('fullSkin');skin.src=`https://mc-heads.net/body/${encodeURIComponent(p.name)}/100`;skin.alt='Vollständiger Minecraft-Skin von '+p.name;document.getElementById('profileDialog').showModal()};pe.append(b)})}
function renderJobs(){je.replaceChildren();roles.forEach((r,i)=>{const max=limits[r],members=players.filter(p=>p.jobs.includes(r)),n=Math.min(free[r]??Math.max(0,max-members.length),max);if((av.value==='free'&&n===0)||(av.value==='occupied'&&n>0))return;const c=document.createElement('article');c.className='card job-card';const h=document.createElement('h3'),count=document.createElement('p'),bar=document.createElement('div'),fill=document.createElement('div'),list=document.createElement('ul'),btn=document.createElement('button');h.textContent=r;count.className='job-count'+(n===0?' full':'');count.textContent=n===0?`Ausgebucht (${max}/${max})`:`${n} von ${max} Plätzen frei (${max-n} belegt)`;bar.className='bar';fill.className='bar-fill'+(n===0?' full':'');fill.style.width=Math.min((max-n)/max,1)*100+'%';bar.append(fill);list.className='members';list.hidden=true;list.id='members-'+i;members.forEach(p=>{const li=document.createElement('li'),im=document.createElement('img');im.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/32`;im.alt='';li.append(im,document.createTextNode(p.name));list.append(li)});if(!members.length)list.innerHTML='<li>Kein Spieler eingetragen</li>';btn.className='expand';btn.type='button';btn.textContent='⌄';btn.setAttribute('aria-label','Spieler anzeigen');btn.setAttribute('aria-expanded','false');btn.onclick=()=>{list.hidden=!list.hidden;btn.setAttribute('aria-expanded',String(!list.hidden))};c.append(h,count,bar,list,btn);je.append(c)});if(!je.children.length)je.innerHTML='<p class="empty">Keine Berufe in dieser Auswahl.</p>'}
search.addEventListener('input',renderPlayers);jf.addEventListener('change',renderPlayers);av.addEventListener('change',renderJobs);document.getElementById('closeProfile').onclick=()=>document.getElementById('profileDialog').close();document.getElementById('profileDialog').addEventListener('click',e=>{if(e.target.id==='profileDialog')e.target.close()});document.querySelectorAll('[role=tab]').forEach((tab,i,all)=>{tab.onclick=()=>all.forEach((t,j)=>{t.setAttribute('aria-selected',String(i===j));document.getElementById(t.getAttribute('aria-controls')).hidden=i!==j})});
const themes=['winter','autumn','spring','summer','midnight','desert','dragon','forest','moor'],design=document.getElementById('design');function setDesign(t){if(!themes.includes(t))t='desert';document.body.dataset.theme=t;design.value=t;try{localStorage.setItem('arcadia-design',t)}catch{}const w=document.getElementById('weather');w.replaceChildren();for(let i=0;i<32;i++){const p=document.createElement('span');p.className='particle';p.textContent=t==='winter'?'❄':t==='autumn'?'🍂':t==='spring'?'✿':'✦';p.style.cssText=`--x:${Math.random()*100}%;--size:${12+Math.random()*12}px;--time:${7+Math.random()*10}s;--delay:${-Math.random()*10}s;--drift:${-45+Math.random()*90}px`;w.append(p)}}design.addEventListener('change',()=>setDesign(design.value));let saved='desert';try{saved=localStorage.getItem('arcadia-design')||'desert'}catch{}setDesign(saved);renderPlayers();renderJobs();
</script></body></html>
