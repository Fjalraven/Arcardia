<html lang="de">

  <title>Arcadia – Spieler &amp; Berufe</title>
  <style>

    body[data-theme="summer"]{--parchment:#fff8df;--ink:#17443d;--gold:#f6c85f;--panel:rgba(255,250,229,.96);--green:#27836b;--red:#c44f45;--sky-top:#23a9bd;--sky-bottom:#f3a64c;--shade:rgba(10,65,72,.2);--logo-light:#fff5b8;--logo-mid:#ffc24d;--logo-dark:#ed7651;--logo-inner-light:#fffce5;--logo-inner-dark:#ffe0a3;--logo-stroke:#74433b;--logo-accent:#e98548;--logo-shield:#e97950;--logo-glow:#fff4ad;--logo-gem:#35a9a0;--logo-details:#563a3c}
    header{position:relative;padding:38px 20px 26px;color:var(--parchment);text-align:center;border-bottom:3px solid var(--gold)}.design-picker{position:absolute;top:16px;right:18px;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--gold);border-radius:9px;background:var(--panel);color:var(--ink);box-shadow:0 3px 12px rgba(0,0,0,.15)}.design-picker label{font-weight:bold}.design-picker select{width:auto;min-width:115px;padding:7px 9px;border:1px solid var(--gold);border-radius:6px;background:var(--parchment);color:var(--ink);font:inherit}.crest{width:110px;height:110px;margin:0 auto 12px;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}h1{margin:6px 0;font-size:clamp(2rem,6vw,3.2rem)}header p{margin:0;font-size:1.1rem}
    main{position:relative;z-index:1;max-width:1050px;margin:22px auto;padding:0 18px}.tab-list{display:flex;gap:8px;margin-bottom:20px;padding-bottom:8px;border-bottom:2px solid var(--gold)}.tab-button{padding:12px 20px;border:2px solid var(--gold);border-bottom:0;border-radius:9px 9px 0 0;background:rgba(255,248,229,.72);color:var(--ink);font:bold 1rem Georgia,"Times New Roman",serif;cursor:pointer}.tab-button[aria-selected="true"]{background:var(--parchment);color:var(--ink)}.tab-button:focus-visible,.design-picker select:focus-visible,.expand-button:focus-visible{outline:3px solid white;outline-offset:3px}[role="tabpanel"]:focus{outline:none}.section-title{margin:0 0 16px;color:var(--parchment);font-size:1.7rem}.jobs-grid,.players-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.job-card{position:relative;padding:17px 17px 54px;border:2px solid var(--gold);border-radius:10px;background:var(--panel);box-shadow:0 5px 15px rgba(0,0,5,.05)}.job-card h3{margin:0 0 8px;font-size:1.2rem}.job-count{margin:0;color:var(--green);font-weight:bold}.job-count.full{color:var(--red)}.job-bar{height:10px;margin-top:12px;overflow:hidden;border-radius:99px;background:#d7c8a9}.job-bar-fill{height:100%;border-radius:inherit;background:var(--green)}.job-bar-fill.full{background:var(--red)}.job-members{display:grid;gap:8px;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--gold);list-style:none}.job-member{display:flex;align-items:center;gap:9px;min-width:0}.job-member img{width:40px;height:40px;flex:0 0 40px;border:2px solid var(--gold);border-radius:6px;background:#e4d3ae;image-rendering:pixelated}.job-member span{overflow-wrap:anywhere}.expand-button{position:absolute;right:10px;bottom:10px;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;background:var(--parchment);color:var(--ink);cursor:pointer;transition:transform .2s,background .2s}.expand-button:hover{background:var(--gold)}.expand-button[aria-expanded="true"]{transform:rotate(180deg)}.expand-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}input,main select{flex:1 1 220px;padding:13px 15px;border:2px solid var(--gold);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}.design-picker select{flex:initial}.player-card{display:flex;align-items:center;gap:14px;padding:14px;border:2px solid var(--gold);border-radius:10px;background:var(--panel);box-shadow:0 5px 15px rgba(0,0,5,.05)}.skin-head{width:64px;height:64px;flex:0 0 64px;border:2px solid var(--gold);border-radius:6px;background:#e4d3ae;image-rendering:pixelated}.player-info h3{margin:0 0 8px;font-size:1.2rem;overflow-wrap:anywhere}.player-job{color:#76501d;font-weight:bold}body[data-theme="winter"] .player-job{color:#245c7d}body[data-theme="spring"] .player-job{color:#466c31}body[data-theme="summer"] .player-job{color:#176f5d}.empty{grid-column:1/-1;color:var(--parchment);text-align:center}footer{position:relative;z-index:1;padding:20px;color:var(--parchment);text-align:center}
    #weather{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.particle{position:absolute;top:-12vh;left:var(--left);opacity:var(--opacity);animation:fall var(--duration) linear var(--delay) infinite;will-change:transform}body[data-theme="winter"] .particle{color:#fff;text-shadow:0 0 8px #dff5ff;font-size:var(--size)}body[data-theme="autumn"] .particle{color:var(--leaf-color,#ed9b36);font-size:var(--size);text-shadow:0 1px 3px rgba(83,40,12,.35)}body[data-theme="spring"] .particle{color:var(--flower-color,#fff1f4);font-size:var(--size);filter:drop-shadow(0 1px 2px rgba(74,76,43,.35));text-shadow:0 0 8px rgba(255,255,255,.75)}body[data-theme="summer"] .particle{top:var(--top);color:var(--spark-color);font-size:var(--size);text-shadow:0 0 10px rgba(255,247,153,.9);animation:firefly-drift var(--duration) ease-in-out var(--delay) infinite alternate}@keyframes fall{0%{transform:translate3d(0,-8vh,0) rotate(0)}50%{transform:translate3d(var(--drift),52vh,0) rotate(180deg)}100%{transform:translate3d(calc(var(--drift) * .5),112vh,0) rotate(360deg)}}@keyframes firefly-drift{0%{transform:translate3d(0,0,0) scale(.65);opacity:.25}50%{opacity:1}100%{transform:translate3d(var(--drift),45px,0) scale(1.25);opacity:.45}}
    @media(max-width:520px){.design-picker{top:10px;right:10px}header{padding-top:70px}.design-picker label{display:none}.design-picker select{min-width:105px}}@media(max-width:480px){.tab-button{flex:1;padding:11px 8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}.particle{animation:none!important;display:none}}
  </style>
</head>
<body data-theme="winter">
  <div id="weather" aria-hidden="true"></div>
  <header>
    <div class="design-picker"><label for="designSelect">Design</label><select id="designSelect" aria-label="Design auswählen"><option value="winter">Winter</option><option value="autumn">Herbst</option><option value="spring">Frühling</option><option value="summer">Sommer</option></select></div>
    <svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Arcadia Logo"><defs><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="var(--logo-light)"/><stop offset="50%" stop-color="var(--logo-mid)"/><stop offset="100%" stop-color="var(--logo-dark)"/></linearGradient><linearGradient id="innerGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="var(--logo-inner-light)"/><stop offset="100%" stop-color="var(--logo-inner-dark)"/></linearGradient></defs><path d="M60 8 L98 18 L98 56 C98 82 82 100 60 110 C38 100 22 82 22 56 L22 18 Z" fill="url(#shieldGrad)" stroke="var(--logo-stroke)" stroke-width="3"/><path d="M60 18 L88 25 L88 55 C88 72 76 86 60 94 C44 86 32 72 32 55 L32 25 Z" fill="url(#innerGrad)" stroke="var(--logo-stroke)" stroke-width="2"/><path d="M39 45 L60 26 L81 45 L75 47 L68 40 L60 45 L52 40 L45 47 Z" fill="var(--logo-accent)" opacity=".9"/><path d="M46 55 L60 44 L74 55 L71 76 L60 85 L49 76 Z" fill="var(--logo-shield)"/><path d="M60 49 L64 62 L60 73 L56 62 Z" fill="var(--logo-glow)"/><path d="M52 60 L60 57 L68 60 L69 68 L60 74 L51 68 Z" fill="var(--logo-gem)"/><path d="M27 42 L35 39 L39 45 L33 49 Z M93 42 L85 39 L81 45 L87 49 Z" fill="var(--logo-details)" opacity=".85"/><path d="M41 32 L60 19 L79 32" fill="none" stroke="var(--logo-stroke)" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="41" r="5" fill="var(--logo-details)"/><path d="M60 47 L60 84 M46 62 L60 54 L74 62" fill="none" stroke="var(--logo-stroke)" stroke-width="3" stroke-linecap="round"/></svg>
    <h1>Arcadia</h1><p>Die Bewohner, ihre Berufe und freie Plätze</p>
  </header>
  <main>
    <div class="tab-list" role="tablist" aria-label="Arcadia Bereiche"><button class="tab-button" id="playersTab" type="button" role="tab" aria-selected="true" aria-controls="playersPanel" tabindex="0">Spieler</button><button class="tab-button" id="jobsTab" type="button" role="tab" aria-selected="false" aria-controls="jobsPanel" tabindex="-1">Berufe &amp; freie Plätze</button></div>
    <section id="playersPanel" role="tabpanel" aria-labelledby="playersTab" tabindex="0"><h2 class="section-title">Spielerinnen und Spieler</h2><div class="controls"><input id="search" type="search" placeholder="Spieler suchen …" aria-label="Spieler suchen"><select id="jobFilter" aria-label="Nach Beruf filtern"><option value="">Alle Berufe</option></select></div><div id="players" class="players-grid" aria-live="polite"></div></section>
    <section id="jobsPanel" role="tabpanel" aria-labelledby="jobsTab" tabindex="0" hidden><h2 class="section-title">Freie Plätze nach Beruf</h2><div id="jobs" class="jobs-grid" aria-live="polite"></div></section>
  </main>
  <footer>Willkommen in Arcadia – unserem mittelalterlichen Minecraft-Rollenspiel!</footer>
  <script>
    const DEFAULT_MAX_PRO_BERUF=100;
    const MAX_PRO_BERUF_NACH_BERUF={Schmied:5,Marktschreier:5,Magier:5,Bäcker:5,Jäger:5,Bauer:100,Metzger:5,Fischer:100,Ramschladenbesitzer:6,König:1,Königsgarde:3,Wirt:5,Soldat:200,Torwächter:20,Minenarbeiter:100,Ritter:10,Holzfäller:20};
    const FREIE_PLAETZE_NACH_BERUF={Schmied:0,Marktschreier:0,Magier:0,Bäcker:0,Jäger:0,Metzger:0,Ramschladenbesitzer:0,König:0,Königsgarde:0,Wirt:0,Torwächter:0,Mönch:0,Holzfäller:0,Ritter:0,Minenarbeiter:16,Bauer:23,Soldat:128,Fischer:38};
    const berufe=["Schmied","Marktschreier","Magier","Bäcker","Jäger","Bauer","Metzger","Fischer","Ramschladenbesitzer","König","Königsgarde","Wirt","Soldat","Torwächter","Minenarbeiter","Mönch","Holzfäller","Ritter"];
    const spieler=[
      {name:"PaperStraw58602",berufe:["König"]},{name:"Mojel11YT",berufe:["Königsgarde"]},{name:"Benzjamin",berufe:["Wirt"]},{name:"PHOENIX XD",berufe:["Soldat"]},{name:"x_simmi",berufe:["Fischer"]},{name:"PriicyRex4038",berufe:["Torwächter"]},{name:"Mapaa5",berufe:["Fischer"]},{name:"AetherXgames",berufe:["Minenarbeiter"]},{name:"LettLukas",berufe:["Bäcker"]},{name:"Jakobber2000",berufe:["Soldat"]},{name:"xr643",berufe:["Bauer"]},{name:"Caraoelin",berufe:["Bauer"]},{name:"Quirity15",berufe:["Soldat"]},{name:"Delfine4904",berufe:["Bauer"]},{name:"Maax67",berufe:["Mönch"]},{name:"CraftLife12",berufe:["Soldat"]},{name:"zackdiebohn",berufe:["Schmied"]},{name:"Zero",berufe:["Soldat"]},{name:"DiamondDragon",berufe:["Soldat"]},{name:"Sharkalarm",berufe:["Holzfäller"]},{name:"Babbles1042",berufe:["Bauer"]},{name:"RichiHD",berufe:["Bauer"]},{name:"Nao878",berufe:["Soldat"]},{name:"Bluecronik12",berufe:["Bauer"]},{name:"FantasticVici",berufe:["Holzfäller"]},{name:"Zupiruchi",berufe:["Mönch"]},{name:"CaptainBintang",berufe:["Holzfäller"]},{name:"TheFiredoom",berufe:["Minenarbeiter"]},{name:"Akakarivus",berufe:["Ritter"]},{name:"Diefire",berufe:["Ritter"]},{name:"Eigella",berufe:["Minenarbeiter"]},{name:"N04H_MINECR4FT",berufe:["Fischer"]},{name:"Phoenix90312",berufe:["Soldat"]},{name:"Kenanzockt5814",berufe:["Fischer"]},{name:"LeadedSnow51573",berufe:["Ritter"]},{name:"GamedFio2024",berufe:["Fischer"]},{name:"Gedankebar6029",berufe:["Fischer"]},{name:"truewither",berufe:["Soldat"]},{name:"ScarletJP",berufe:["Soldat"]},{name:"Timmm1893",berufe:["Minenarbeiter","Soldat"]},{name:"SnowingSun3017",berufe:["Bauer"]},{name:"Zwergnase2111",berufe:["Soldat"]},{name:"Emilcrafty03",berufe:["Mönch"]},{name:"Spilraleel",berufe:["Bäcker"]},{name:"C4_Meister",berufe:["Soldat"]},{name:"Entonrat12345",berufe:["Ritter"]},{name:"MaxiF180",berufe:["Soldat","Bäcker"]},{name:"ItsSamuMC",berufe:["Soldat"]},{name:"FindusMC",berufe:["Holzfäller"]},{name:"yellowwider822",berufe:["Soldat"]},{name:"NCHTz1",berufe:["Holzfäller"]},{name:"hannes1235090",berufe:["Bauer","Soldat"]},{name:"DinoNugget1242",berufe:["Minenarbeiter"]},{name:"Rex_Tenebris377",berufe:["Soldat","Holzfäller"]},{name:"DarkKnightVJ",berufe:["Soldat","Holzfäller"]},{name:"Fjalraven",berufe:["Magier","Torwächter"]}
    ];
    const jobsEl=document.getElementById("jobs"),playersEl=document.getElementById("players"),searchEl=document.getElementById("search"),filterEl=document.getElementById("jobFilter"),designSelect=document.getElementById("designSelect"),weatherEl=document.getElementById("weather");
    const tabs=[{button:document.getElementById("playersTab"),panel:document.getElementById("playersPanel")},{button:document.getElementById("jobsTab"),panel:document.getElementById("jobsPanel")}];
    function makeExpandButton(label,controls){const button=document.createElement("button");button.type="button";button.className="expand-button";button.setAttribute("aria-label",label);button.setAttribute("aria-expanded","false");button.setAttribute("aria-controls",controls);button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';return button}
    function setDesign(theme){const valid=["winter","autumn","spring","summer"],selected=valid.includes(theme)?theme:"winter";document.body.dataset.theme=selected;designSelect.value=selected;try{localStorage.setItem("arcadia-design",selected)}catch{}weatherEl.replaceChildren();const sets={winter:{symbols:["❄","✦","❅","✧"],count:55},autumn:{symbols:["🍂","🍁","❧"],count:35},spring:{symbols:["🌷","🌼","✿","❀"],count:42},summer:{symbols:["✦","✧","✹"],count:34}};const {symbols,count}=sets[selected];for(let i=0;i<count;i++){const particle=document.createElement("span");particle.className="particle";particle.textContent=symbols[Math.floor(Math.random()*symbols.length)];particle.style.setProperty("--left",`${Math.random()*100}%`);particle.style.setProperty("--size",`${selected==="spring"?9+Math.random()*5:14+Math.random()*12}px`);particle.style.setProperty("--opacity",`${.45+Math.random()*.55}`);particle.style.setProperty("--duration",`${8+Math.random()*12}s`);particle.style.setProperty("--delay",`${-Math.random()*20}s`);particle.style.setProperty("--drift",`${-60+Math.random()*120}px`);if(selected==="autumn")particle.style.setProperty("--leaf-color",["#c2410c","#e87916","#a16207","#b45309"][i%4]);if(selected==="spring")particle.style.setProperty("--flower-color",["#ff6fae","#ff9f1c","#fff06a","#c084fc"][i%4]);if(selected==="summer"){particle.style.setProperty("--top",`${Math.random()*100}%`);particle.style.setProperty("--duration",`${3+Math.random()*6}s`);particle.style.setProperty("--delay",`${-Math.random()*8}s`);particle.style.setProperty("--spark-color",["#fff5b0","#ffe17b","#ffffff"][i%3]);}weatherEl.appendChild(particle);}}
    designSelect.addEventListener("change",()=>setDesign(designSelect.value));let savedDesign="winter";try{savedDesign=localStorage.getItem("arcadia-design")||"winter"}catch{}setDesign(savedDesign);
    function selectTab(selectedTab,moveFocus=false){tabs.forEach(tab=>{const selected=tab===selectedTab;tab.button.setAttribute("aria-selected",String(selected));tab.button.tabIndex=selected?0:-1;tab.panel.hidden=!selected});if(moveFocus)selectedTab.button.focus()}
    tabs.forEach((tab,index)=>{tab.button.addEventListener("click",()=>selectTab(tab));tab.button.addEventListener("keydown",event=>{if(event.key==="ArrowRight"||event.key==="ArrowLeft"){event.preventDefault();const direction=event.key==="ArrowRight"?1:-1;selectTab(tabs[(index+direction+tabs.length)%tabs.length],true)}})});
    function renderJobs(){jobsEl.replaceChildren();berufe.forEach((beruf,index)=>{const max=MAX_PRO_BERUF_NACH_BERUF[beruf]??DEFAULT_MAX_PRO_BERUF,jobSpieler=spieler.filter(p=>p.berufe.includes(beruf)),manuellFrei=FREIE_PLAETZE_NACH_BERUF[beruf],frei=manuellFrei===undefined?Math.max(0,max-jobSpieler.length):Math.min(manuellFrei,max),belegt=max-frei;const card=document.createElement("article");card.className="job-card";const heading=document.createElement("h3");heading.textContent=beruf;const count=document.createElement("p");count.className=`job-count${frei===0?" full":""}`;count.textContent=frei===0?`Ausgebucht (${belegt}/${max})`:`${frei} von ${max} Plätzen frei (${belegt} belegt)`;const bar=document.createElement("div");bar.className="job-bar";bar.setAttribute("role","progressbar");bar.setAttribute("aria-label",`Belegte Plätze für ${beruf}`);bar.setAttribute("aria-valuemin","0");bar.setAttribute("aria-valuemax",String(max));bar.setAttribute("aria-valuenow",String(Math.min(belegt,max)));const fill=document.createElement("div");fill.className=`job-bar-fill${frei===0?" full":""}`;fill.style.width=`${Math.min(belegt/max,1)*100}%`;bar.appendChild(fill);const list=document.createElement("ul");list.className="job-members";list.id=`job-members-${index}`;list.hidden=true;list.setAttribute("aria-label",`Spieler mit dem Beruf ${beruf}`);if(jobSpieler.length){jobSpieler.forEach(p=>{const li=document.createElement("li");li.className="job-member";const img=document.createElement("img");img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/40`;img.alt="";img.width=40;img.height=40;img.onerror=()=>{img.style.visibility="hidden"};const name=document.createElement("span");name.textContent=p.name;li.append(img,name);list.appendChild(li)})}else{const li=document.createElement("li");li.textContent="Kein Spieler eingetragen";list.appendChild(li)}const toggle=makeExpandButton(`Spieler für ${beruf} anzeigen`,list.id);toggle.addEventListener("click",()=>{const open=toggle.getAttribute("aria-expanded")==="true";toggle.setAttribute("aria-expanded",String(!open));toggle.setAttribute("aria-label",`Spieler für ${beruf} ${open?"anzeigen":"ausblenden"}`);list.hidden=open});card.append(heading,count,bar,list,toggle);jobsEl.appendChild(card)})}
    berufe.forEach(beruf=>{const option=document.createElement("option");option.value=beruf;option.textContent=beruf;filterEl.appendChild(option)});
    function renderPlayers(){const query=searchEl.value.trim().toLowerCase(),job=filterEl.value,matches=spieler.filter(p=>p.name.toLowerCase().includes(query)&&(!job||p.berufe.includes(job)));playersEl.replaceChildren();if(!matches.length){const empty=document.createElement("p");empty.className="empty";empty.textContent="Kein Spieler gefunden.";playersEl.appendChild(empty);return}matches.forEach(p=>{const card=document.createElement("article");card.className="player-card";const head=document.createElement("img");head.className="skin-head";head.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/64`;head.alt=`Minecraft-Skin von ${p.name}`;head.width=64;head.height=64;head.onerror=()=>{head.style.visibility="hidden"};const info=document.createElement("div"),name=document.createElement("h3"),job=document.createElement("div");info.className="player-info";name.textContent=p.name;job.className="player-job";job.textContent=p.berufe.length?`Berufe: ${p.berufe.join(", ")}`:"Noch kein Beruf eingetragen";info.append(name,job);card.append(head,info);playersEl.appendChild(card)})}
    searchEl.addEventListener("input",renderPlayers);filterEl.addEventListener("change",renderPlayers);renderJobs();renderPlayers();
  </script>
</body>
</html>
