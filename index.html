gn-items:center;gap:10px}.job-member img,.skin-head{width:40px;height:40px;flex:0 0 40px;border:2px solid var(--gold);border-radius:6px;background:#e4d3ae;image-rendering:pixelated}.job-member span{overflow-wrap:anywhere}.expand-button{position:absolute;right:10px;bottom:10px;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;background:var(--parchment);color:var(--ink);cursor:pointer;transition:transform .2s}.expand-button[aria-expanded="true"]{transform:rotate(180deg)}.expand-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}input,main select{flex:1 1 220px;padding:13px 15px;border:2px solid var(--gold);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}.design-picker select{flex:initial}.player-card{padding:14px}.skin-head{width:64px;height:64px;flex-basis:64px}.player-info h3{overflow-wrap:anywhere}.player-job{font-weight:bold;color:var(--green)}.empty{grid-column:1/-1;color:var(--parchment);text-align:center}footer{position:relative;z-index:1;padding:20px;color:var(--parchment);text-align:center}#weather{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.particle{position:absolute;left:var(--left);opacity:var(--opacity);animation:fall var(--duration) linear var(--delay) infinite;will-change:transform}body[data-theme="winter"] .particle{color:#fff;font-size:var(--size)}body[data-theme="autumn"] .particle{color:var(--leaf-color);font-size:var(--size)}body[data-theme="spring"] .particle{color:var(--flower-color);font-size:var(--size)}body[data-theme="summer"] .particle,body[data-theme="midnight"] .particle,body[data-theme="forest"] .particle{top:var(--top);color:var(--spark-color);font-size:var(--size);animation:firefly var(--duration) ease-in-out var(--delay) infinite alternate}body[data-theme="desert"] .particle{top:var(--top);color:va const DEFAULT_MAX_PRO_BERUF=100,MAX_PRO_BERUF_NACH_BERUF={Schmied:5,Marktschreier:5,Magier:5,Bäcker:5,Jäger:5,Bauer:100,Metzger:5,Fischer:100,Ramschladenbesitzer:6,König:1,Königsgarde:3,Wirt:5,Soldat:200,Torwächter:20,Minenarbeiter:100,Mönch:20,Ritter:10,Holzfäller:20},FREIE_PLAETZE_NACH_BERUF={Schmied:0,Marktschreier:0,Magier:0,Bäcker:0,Jäger:0,Metzger:0,Ramschladenbesitzer:0,König:0,Königsgarde:0,Wirt:0,Torwächter:0,Mönch:0,Holzfäller:0,Ritter:0,Minenarbeiter:16,Bauer:23,Soldat:128,Fischer:38};

function setDesign(theme){const themes=["winter","autumn","spring","summer","midnight","desert","dragon","forest"],selected=themes.includes(theme)?theme:"desert";document.body.dataset.theme=selected;designSelect.value=selected;try{localStorage.setItem("arcadia-design",selected)}catch{}weatherEl.replaceChildren();const particles={winter:["❄","✦","❅","✧"],autumn:["🍂","🍁","❧"],spring:["🌷","🌼","✿","❀"],summer:["✦","✧","✹"],midnight:["✦","✧","⋆","✴"],desert:["·","•","✦","⋅"],dragon:["✦","•","✧","⋅"],forest:["✦","✧","⋆","✴"]},colors={summer:["#fff5b0","#ffe17b","#fff"],midnight:["#fff","#e7d8ff","#bba7ff"],desert:["#fff0c2","#e9b66f","#79d7c4"],dragon:["#ffb347","#ff5a1f","#ffd166"],forest:["#fff","#e3f0d7","#b7d77c"]};for(let i=0;i<42;i++){const p=document.createElement("span");p.className="particle";p.textContent=particles[selected][Math.random()*particles[selected].length|0];p.style.cssText=`--left:${Math.random()*100}%;--size:${14+Math.random()*12}px;--opacity:${.45+Math.random()*.55};--duration:${5+Math.random()*12}s;--delay:${-Math.random()*12}s;--drift:${-60+Math.random()*120}px;--top:${Math.random()*100}%`;if(colors[selected])p.style.setProperty(selected==="desert"?"--sand-color":selected==="dragon"?"--ember-color":"--spark-color",colors[selected][i%3]);if(selected==="autumn")p.style.setProperty("--leaf-color",["#c2410c","#e87916","#a16207"][i%3]);if(selected==="spring")p.style.setProperty("--flower-color",["#ff6fae","#ff9f1c","#c084fc"][i%3]);weatherEl.append(p)}}
designSelect.addEventListener("change",()=>setDesign(designSelect.value));let saved="desert";try{saved=localStorage.getItem("arcadia-design")||"desert"}catch{}setDesign(saved);function selectTab(selected,focus=false){tabs.forEach(t=>{const on=t===selected;t.button.setAttribute("aria-selected",String(on));t.button.tabIndex=on?0:-1;t.panel.hidden=!on});if(focus)selected.button.focus()}tabs.forEach((t,i)=>{t.button.addEventListener("click",()=>selectTab(t));t.button.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();selectTab(tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length],true)}})});
function renderJobs(){jobsEl.replaceChildren();berufe.forEach((job,i)=>{const max=MAX_PRO_BERUF_NACH_BERUF[job]??DEFAULT_MAX_PRO_BERUF,members=spieler.filter(p=>p.berufe.includes(job)),free=Math.min(FREIE_PLAETZE_NACH_BERUF[job]??Math.max(0,max-members.length),max),filled=max-free,card=document.createElement("article");card.className="job-card";const h=document.createElement("h3");h.textContent=job;const count=document.createElement("p");count.className=`job-count${free===0?" full":""}`;count.textContent=free===0?`Ausgebucht (${filled}/${max})`:`${free} von ${max} Plätzen frei (${filled} belegt)`;const bar=document.createElement("div");bar.className="job-bar";const fill=document.createElement("div");fill.className=`job-bar-fill${free===0?" full":""}`;fill.style.width=`${Math.min(filled/max,1)*100}%`;bar.append(fill);const list=document.createElement("ul");list.className="job-members";list.id=`members-${i}`;list.hidden=true;members.forEach(p=>{const li=document.createElement("li");li.className="job-member";const img=document.createElement("img");img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/40`;img.alt="";const n=document.createElement("span");n.textContent=p.name;li.append(img,n);list.append(li)});const b=document.createElement("button");b.className="expand-button";b.type="button";b.setAttribute("aria-label",`Spieler für ${job} anzeigen`);b.setAttribute("aria-expanded","false");b.setAttribute("aria-controls",list.id);b.innerHTML='<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';b.onclick=()=>{list.hidden=!list.hidden;b.setAttribute("aria-expanded",String(!list.hidden))};card.append(h,count,bar,list,b);jobsEl.append(card)})}
berufe.forEach(j=>{const o=document.createElement("option");o.value=j;o.textContent=j;filterEl.append(o)});function renderPlayers(){const q=searchEl.value.trim().toLowerCase(),job=filterEl.value,matches=spieler.filter(p=>p.name.toLowerCase().includes(q)&&(!job||p.berufe.includes(job)));playersEl.replaceChildren();if(!matches.length){playersEl.textContent="Kein Spieler gefunden.";return}matches.forEach(p=>{const card=document.createElement("article");card.className="player-card";const img=document.createElement("img");img.className="skin-head";img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/64`;img.alt=`Minecraft-Skin von ${p.name}`;const info=document.createElement("div"),name=document.createElement("h3"),jobEl=document.createElement("div");info.className="player-info";name.textContent=p.name;jobEl.className="player-job";jobEl.textContent=`Berufe: ${p.berufe.join(", ")}`;info.append(name,jobEl);card.append(img,info);playersEl.append(card)})}searchEl.addEventListener("input",renderPlayers);filterEl.addEventListener("change",renderPlayers);renderJobs();renderPlayers();
