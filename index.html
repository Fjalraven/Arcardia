<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcardia – Spieler &amp; Berufe</title>
<style>
:root{color-scheme:light;--paper:#fff0d2;--ink:#492b24;--gold:#e7a85b;--panel:rgba(255,244,220,.95);--green:#287c78;--red:#a83e32}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,serif;background:linear-gradient(145deg,#e58f5c,#56334a)}header,footer{text-align:center;color:var(--paper);padding:24px}h1{font-size:clamp(2rem,6vw,3rem);margin:.3em}main{max-width:1050px;margin:auto;padding:16px}.tabs,.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.tabs{border-bottom:2px solid var(--gold)}button,input,select{font:inherit;padding:11px 14px;border:2px solid var(--gold);border-radius:8px;color:var(--ink);background:var(--panel)}button{cursor:pointer}.tabs button[aria-selected=true]{background:var(--paper)}input,main select{flex:1 1 200px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{padding:15px;border:2px solid var(--gold);border-radius:10px;background:var(--panel);box-shadow:0 4px 12px #0002}.player{display:flex;gap:12px;align-items:center}.player img,.member img{width:48px;height:48px;image-rendering:pixelated;border:1px solid var(--gold);border-radius:6px}.member img{width:32px;height:32px}.job-count{font-weight:bold;color:var(--green)}.job-count.full{color:var(--red)}.members{padding-left:0;list-style:none}.member{display:flex;align-items:center;gap:8px;margin:6px 0}.empty{color:var(--paper);text-align:center;grid-column:1/-1}[hidden]{display:none!important}
</style>
</head>
<body><header><h1>Arcardia</h1><p>Die Bewohner, ihre Berufe und freie Plätze</p></header>
<main><nav class="tabs" role="tablist" aria-label="Arcardia Bereiche"><button role="tab" aria-selected="true" aria-controls="playersPanel">Spieler</button><button role="tab" aria-selected="false" aria-controls="jobsPanel">Berufe &amp; freie Plätze</button></nav>
<section id="playersPanel"><h2>Spielerinnen und Spieler</h2><div class="controls"><input id="search" type="search" placeholder="Spieler suchen …" aria-label="Spieler suchen"><select id="filter" aria-label="Nach Beruf filtern"><option value="">Alle Berufe</option></select></div><div id="players" class="grid" aria-live="polite"></div></section>
<section id="jobsPanel" hidden><h2>Freie Plätze nach Beruf</h2><div id="jobs" class="grid"></div></section></main><footer>Willkommen in Arcardia – unserem mittelalterlichen Minecraft-Rollenspiel!</footer>
<script>
const limits={Schmied:5,Marktschreier:5,Magier:5,Bäcker:5,Jäger:5,Bauer:100,Metzger:5,Fischer:100,Ramschladenbesitzer:6,König:1,Königsgarde:3,Wirt:5,Soldat:200,Torwächter:20,Minenarbeiter:100,Mönch:20,Ritter:10,Holzfäller:100,"Rechte Hand des Königs":1};
const free={Schmied:0,Marktschreier:0,Magier:0,Bäcker:0,Jäger:0,Metzger:0,Ramschladenbesitzer:0,König:0,Königsgarde:0,Wirt:0,Torwächter:0,Mönch:0,Holzfäller:0,Ritter:0,Minenarbeiter:16,Bauer:23,Soldat:128,Fischer:38,"Rechte Hand des Königs":0};
const people=[
["Fjalraven","Magier","Torwächter"],["DinoNugget1242","Minenarbeiter"],["ItsSamuMC","Soldat"],["C4_Meister","Soldat"],["PaperStraw58602","König"],["Mojel11YT","Königsgarde"],["Benzjamin","Wirt"],["PHOENIX XD","Soldat"],["x_simmi","Fischer"],["PriicyRex4038","Torwächter"],["Mapaa5","Fischer"],["AetherXgames","Minenarbeiter"],["LettLukas","Bäcker"],["Jakobber2000","Soldat"],["xr643","Bauer"],["Caraoelin","Bauer"],["Quirity15","Soldat"],["Delfine4904","Bauer"],["Maax67","Mönch"],["CraftLife12","Soldat"],["zackdiebohn","Schmied"],["Zero","Soldat"],["DiamondDragon","Soldat"],["Sharkalarm","Holzfäller"],["RichiHD","Bauer"],["Nao878","Soldat"],["Bluecronik12","Bauer"],["FantasticVici","Holzfäller"],["Zupiruchi","Mönch"],["CaptainBintang","Holzfäller"],["TheFiredoom","Minenarbeiter"],["Akakarivus","Ritter"],["Diefire","Ritter"],["Eigella","Minenarbeiter"],["N04H_MINECR4FT","Fischer"],["Phoenix90312","Soldat"],["Kenanzockt5814","Fischer"],["LeadedSnow51573","Ritter"],["GamedFio2024","Fischer"],["Gedankebar6029","Fischer"],["truewither","Soldat"],["ScarletJP","Soldat"],["Timmm1893","Minenarbeiter","Soldat"],["SnowingSun3017","Bauer"],["Zwergnase2111","Soldat"],["Emilcrafty03","Mönch"],["Spilraleel","Bäcker"],["Entonrat12345","Holzfäller","Soldat"],["MaxiF180","Soldat","Bäcker"],["FindusMC","Holzfäller"],["yellowwider822","Soldat"],["NCHTz1","Holzfäller"],["hannes1235090","Bauer","Soldat"],["Rex_Tenebris377","Soldat","Holzfäller"],["DarkKnightVJ","Soldat","Holzfäller"],["BCCaoti","Bauer"],["Kosmosxp","Ritter"],["babbels1042","Bauer"],["darknightIV","Bauer","Soldat"],["kingofrivers343","Rechte Hand des Königs","Gründer"]
].map(([name,...roles])=>({name,roles:roles.filter(x=>x!=="Gründer"),title:roles.includes("Gründer")?"Gründer":""}));
const roles=Object.keys(limits),playersEl=document.querySelector('#players'),jobsEl=document.querySelector('#jobs'),filter=document.querySelector('#filter'),search=document.querySelector('#search');
roles.forEach(role=>{const o=document.createElement('option');o.value=role;o.textContent=role;filter.append(o)});
function renderPlayers(){const q=search.value.trim().toLowerCase(),role=filter.value;const found=people.filter(p=>p.name.toLowerCase().includes(q)&&(!role||p.roles.includes(role)));playersEl.replaceChildren();if(!found.length){playersEl.innerHTML='<p class="empty">Kein Spieler gefunden.</p>';return}found.forEach(p=>{const card=document.createElement('article');card.className='card player';const img=document.createElement('img');img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/48`;img.alt=`Minecraft-Skin von ${p.name}`;const info=document.createElement('div'),name=document.createElement('strong'),job=document.createElement('div');name.textContent=p.name;job.textContent='Berufe: '+p.roles.join(', ');info.append(name,job);if(p.title){const title=document.createElement('b');title.textContent='Titel: '+p.title;info.append(title)}card.append(img,info);playersEl.append(card)})}
function renderJobs(){roles.forEach(role=>{const members=people.filter(p=>p.roles.includes(role)),max=limits[role],freeCount=Math.min(free[role]??Math.max(0,max-members.length),max),filled=max-freeCount,card=document.createElement('article');card.className='card';const h=document.createElement('h3'),count=document.createElement('p'),list=document.createElement('ul'),toggle=document.createElement('button');h.textContent=role;count.className='job-count'+(freeCount===0?' full':'');count.textContent=freeCount===0?`Ausgebucht (${filled}/${max})`:`${freeCount} von ${max} Plätzen frei (${filled} belegt)`;list.className='members';list.hidden=true;members.forEach(p=>{const li=document.createElement('li'),img=document.createElement('img');li.className='member';img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/32`;img.alt='';li.append(img,document.createTextNode(p.name));list.append(li)});toggle.type='button';toggle.textContent='Spieler anzeigen';toggle.setAttribute('aria-expanded','false');toggle.onclick=()=>{list.hidden=!list.hidden;toggle.textContent=list.hidden?'Spieler anzeigen':'Spieler ausblenden';toggle.setAttribute('aria-expanded',String(!list.hidden))};card.append(h,count,toggle,list);jobsEl.append(card)})}
document.querySelectorAll('[role=tab]').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('[role=tab]').forEach(t=>{const active=t===tab;t.setAttribute('aria-selected',String(active));document.getElementById(t.getAttribute('aria-controls')).hidden=!active})});search.addEventListener('input',renderPlayers);filter.addEventListener('change',renderPlayers);renderPlayers();renderJobs();
</script></body></html>
