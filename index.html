<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcadia – Spieler &amp; Berufe</title>

  <style>
    :root {
      --parchment: #f3e7c9;
      --ink: #302316;
      --gold: #d3a64a;
      --panel: rgba(255, 248, 229, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        linear-gradient(rgba(35, 25, 16, 0.55), rgba(35, 25, 16, 0.72)),
        radial-gradient(ellipse at top, #94764b, #34271c 70%);
    }

    header {
      padding: 52px 20px 34px;
      color: var(--parchment);
      text-align: center;
      border-bottom: 3px solid var(--gold);
    }

    .crest {
      font-size: 42px;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
    }

    header p {
      margin: 0;
      font-size: 1.15rem;
    }

    main {
      max-width: 1050px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    input,
    select {
      flex: 1 1 220px;
      padding: 13px 15px;
      border: 2px solid var(--gold);
      border-radius: 8px;
      background: var(--parchment);
      color: var(--ink);
      font: inherit;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border: 2px solid var(--gold);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 5px 15px #0005;
    }

    .skin-head {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      border: 2px solid var(--gold);
      border-radius: 6px;
      background: #e4d3ae;
      image-rendering: pixelated;
    }

    .player-info h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      overflow-wrap: anywhere;
    }

    .job {
      color: #76501d;
      font-weight: bold;
    }

    .empty {
      grid-column: 1 / -1;
      color: var(--parchment);
      text-align: center;
    }

    footer {
      padding: 25px;
      color: var(--parchment);
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <div class="crest" aria-hidden="true">⚔️</div>
    <h1>Arcadia</h1>
    <p>Die Bewohner und ihre Berufe</p>
  </header>

  <main>
    <div class="controls">
      <input
        id="search"
        type="search"
        placeholder="Spieler suchen …"
        aria-label="Spieler suchen"
      >

      <select id="jobFilter" aria-label="Nach Beruf filtern">
        <option value="">Alle Berufe</option>
      </select>
    </div>

    <section id="players" class="grid" aria-live="polite"></section>
  </main>

  <footer>
    Willkommen in Arcadia – unserem mittelalterlichen Minecraft-Rollenspiel!
  </footer>

  <script>
    // Ersetze die Platzhalternamen durch eure Minecraft-Spielernamen.
    const spieler = [
      { name: "Fjalraven", beruf: "Magier" },
      { name: "Spielername 2", beruf: "Schmied" },
      { name: "Spielername 3", beruf: "Marktschreier" },
      { name: "Spielername 4", beruf: "Bäcker" },
      { name: "Spielername 5", beruf: "Jäger" },
      { name: "Spielername 6", beruf: "Bauer" },
      { name: "Spielername 7", beruf: "Metzger" },
      { name: "Spielername 8", beruf: "Fischer" },
      { name: "Spielername 9", beruf: "Ramschladenbesitzer" }
    ];

    const playersEl = document.getElementById("players");
    const searchEl = document.getElementById("search");
    const filterEl = document.getElementById("jobFilter");

    [...new Set(spieler.map(eintrag => eintrag.beruf))]
      .sort()
      .forEach(beruf => {
        const option = document.createElement("option");
        option.value = beruf;
        option.textContent = beruf;
        filterEl.appendChild(option);
      });

    function renderPlayers() {
      const suche = searchEl.value.trim().toLowerCase();
      const ausgewaehlterBeruf = filterEl.value;

      const treffer = spieler.filter(eintrag =>
        eintrag.name.toLowerCase().includes(suche) &&
        (!ausgewaehlterBeruf || eintrag.beruf === ausgewaehlterBeruf)
      );

      playersEl.replaceChildren();

      if (treffer.length === 0) {
        const meldung = document.createElement("p");
        meldung.className = "empty";
        meldung.textContent = "Keine Spieler gefunden.";
        playersEl.appendChild(meldung);
        return;
      }

      treffer.forEach(eintrag => {
        const karte = document.createElement("article");
        karte.className = "card";

        const kopf = document.createElement("img");
        kopf.className = "skin-head";
        kopf.src = `https://mc-heads.net/avatar/${encodeURIComponent(eintrag.name)}/64`;
        kopf.alt = `Minecraft-Skin-Kopf von ${eintrag.name}`;
        kopf.width = 64;
        kopf.height = 64;

        const info = document.createElement("div");
        info.className = "player-info";

        const name = document.createElement("h2");
        name.textContent = eintrag.name;

        const beruf = document.createElement("div");
        beruf.className = "job";
        beruf.textContent = `Beruf: ${eintrag.beruf}`;

        info.append(name, beruf);
        karte.append(kopf, info);
        playersEl.appendChild(karte);
      });
    }

    searchEl.addEventListener("input", renderPlayers);
    filterEl.addEventListener("change", renderPlayers);

    renderPlayers();
  </script>
</body>
  </html>
